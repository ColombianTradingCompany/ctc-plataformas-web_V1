<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f2ec;--card:#fff;--ink:#2a1740;--mut:#6e5f80;--line:#e8dff0;--field:#faf7fc;--pri:#3c0a87;--txp:#3c0a87;--acc:#ffcd00;--lav:#d2b9f8;--cv1:#efe3d3;--cv2:#d9c5ad}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150b24;--card:#21143a;--ink:#f3ecfb;--mut:#b4a5cc;--line:#3a2a5c;--field:#190e2c;--pri:#6a3fd0;--txp:#d2b9f8;--cv1:#3a2c4e;--cv2:#2a1d3d}}
:root[data-theme="dark"]{--bg:#150b24;--card:#21143a;--ink:#f3ecfb;--mut:#b4a5cc;--line:#3a2a5c;--field:#190e2c;--pri:#6a3fd0;--txp:#d2b9f8;--cv1:#3a2c4e;--cv2:#2a1d3d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
svg.b{fill:currentColor;stroke:none}
header{background:linear-gradient(120deg,#2a0661,#3c0a87 55%,#52219f);color:#fff;position:relative;overflow:hidden}
header .deco{position:absolute;inset:0;pointer-events:none;color:#fff}
header .deco svg{position:absolute;opacity:.09}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px;position:relative}
.hrow{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{background:#fff;border-radius:14px;padding:10px 16px;box-shadow:0 6px 20px #0004}.logo img{display:block;height:58px}
.ttl{flex:1;min-width:220px}
.ttl h1{font:400 clamp(26px,4vw,40px)/1.05 Anton,Impact,'Arial Narrow',sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
.ttl p{margin:4px 0 0;color:var(--lav);font-size:14px}
.lang{display:flex;background:#ffffff1f;border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:#fff;font:600 13px Inter,sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer}
.lang button.on{background:var(--acc);color:#2a1740}
.stripe{display:flex;height:5px}.stripe i{flex:2;background:#ffcd00}.stripe i:nth-child(2){flex:1;background:#003087}.stripe i:nth-child(3){flex:1;background:#c8102e}
main{max-width:1180px;margin:0 auto;padding:20px 18px 30px;display:grid;grid-template-columns:350px 1fr;gap:20px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px #3c0a8714}
.col{display:flex;flex-direction:column;gap:18px}
h2{margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--txp);display:flex;align-items:center;gap:7px}
h2 svg{color:#d8a900}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input[type=number]{width:100%;padding:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:9px;font:500 15px Inter,sans-serif}
select{width:100%;padding:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:9px;font:500 14px Inter,sans-serif}
input[type=number]:focus,select:focus{outline:2px solid var(--pri);outline-offset:0;border-color:transparent}
.palon .xz{display:none}.palon .g3{grid-template-columns:1fr}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px}
.sw b{font-size:14px;display:block}.sw small{color:var(--mut);font-size:12px}
.tg{position:relative;width:46px;height:26px;flex:none}.tg input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.tg span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.tg span:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+span{background:var(--pri)}.tg input:checked+span:after{left:23px;background:var(--acc)}
.chips{display:flex;gap:8px;margin-top:8px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);padding:9px 6px;border-radius:11px;font:600 13px Inter,sans-serif;cursor:pointer}
.chip.on{border-color:var(--pri);box-shadow:0 0 0 2px #3c0a8730}
.chip.gr svg{color:#6f8f4e}.chip.ro svg{color:#5a3820}
.hint{font-size:12px;color:var(--mut);margin:8px 0 0;font-style:italic}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.st .ic{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--field);color:var(--txp);font-size:18px}
.st .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.st .v{font:400 25px/1.15 Anton,Impact,sans-serif;letter-spacing:.02em;margin-top:3px}
.st small{font-size:11px;color:var(--mut)}
.st.hi{background:linear-gradient(150deg,#3c0a87,#52219f);border:0;color:#fff}
.st.hi .ic{background:var(--acc);color:#2a1740}.st.hi .k,.st.hi small{color:var(--lav)}
#cv{height:430px;border-radius:12px;overflow:hidden;background:linear-gradient(var(--cv1),var(--cv2))}
.vh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.vh h2{margin:0}.vh span{font-size:12px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--acc);color:#2a1740;font:700 14px Inter,sans-serif;padding:12px 18px;border-radius:12px;cursor:pointer;box-shadow:0 3px 10px #ffcd0055}
.btn:disabled{opacity:.6;cursor:wait}
.ct{display:flex;gap:14px;align-items:center}.ct img{width:92px;height:92px;border-radius:10px;border:1px solid var(--line)}.ct p{margin:0;font-size:13px;color:var(--mut)}.ct b{color:var(--ink);display:block;font-size:14px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 18px 22px}
</style>

function ponerTrabajo(e){if(!e||e.v!==1)return;const p=(id,k)=>{if(e[k]!=null)$(id).value=String(e[k])};
 p("dim-l","l");p("dim-w","w");p("dim-h","h");p("density","d");p("stack-x","x");p("stack-y","y");p("stack-z","z");p("pal-size","palSize");p("pal-cap","cap");p("aim","aim");
 $("box-toggle").checked=!!e.box;$("pal-toggle").checked=!!e.pal;setAimMode(e.aimMode=="dens"?"dens":"stack",1);calc();S.aim=+e.aimOn||0;aimNote()}
function resumenTrabajo(){const t=T[lang];return `${S.l}×${S.w}×${S.h} cm · ${R.n} ${t.units} · ${nf(R.tw,0)} kg`+(R.pl?` · ${R.pl.p} ${R.pl.p>1?"pallets":"pallet"} ${S.pal.k}`:"")}
