    "<div class=\"idiomas\" role=\"group\" aria-label=\"Idioma · Language · Sprache\">"+IDIOMAS.map(function(x){ return "<button data-a=\"lang\" data-v=\""+x+"\" class=\""+(x===LANG?"on":"")+"\" aria-pressed=\""+(x===LANG)+"\">"+x.toUpperCase()+"</button>"; }).join("")+"</div>"+
    "<button class=\"bt\" data-a=\"guia\">"+t("guia")+"</button><button class=\"bt\" data-a=\"nuevo\">"+t("nuevo")+"</button><button class=\"bt\" data-a=\"cargar\">"+t("cargar")+"</button><button class=\"bt oro\" data-a=\"guardar\">"+t("guardar")+"</button></div>";
  document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight+"px");
}
function pintarCinta(){
  const c = $("#cinta"), ver = !!S.metodo && !UI.elegir;
  c.hidden = !ver; document.body.setAttribute("data-m", ver ? S.metodo : "");
  if(ver) c.innerHTML = "<span class=\"sello\">"+(S.metodo==="sca"?"SCA 2004":"CVA")+"</span><span class=\"que\">"+t(S.metodo==="sca"?"cintaSca":"cintaCva")+"</span>"+ib("dif")+"<button data-a=\"elegir\">"+t("cambiar")+"</button>";
}
function pintarPanel(){ const p = $("#panel"); if(!p){ pintar(); return; } p.innerHTML = vistaPanel(); refrescar(); }
function pintar(){
  LANG = S.lang; document.documentElement.lang = LANG;
  pintarTop(); pintarCinta();
  const app = $("#app");
  if(!S.metodo || UI.elegir){ app.innerHTML = vistaElegir(); return; }
  if(UI.tab!=="ficha" && !S.partes[UI.tab]) UI.tab = tabsVisibles()[0][0];
  app.innerHTML = "<div class=\"no-imp\">"+vistaSesion()+vistaLotes()+vistaTabs()+"</div><div id=\"panel\">"+vistaPanel()+"</div>";
  refrescar();
}

/* ═══════════════════════════════════════════════════════════════════════════
   8. ACCIONES — un solo oído para los clics (data-a) y otro para lo que se escribe.
   ═══════════════════════════════════════════════════════════════════════════ */
let tToast = null, tFicha = null;
function toast(msg, err){ const el = $("#toast"); el.textContent = msg; el.className = "ver"+(err?" err":""); clearTimeout(tToast); tToast = setTimeout(function(){ el.className = ""; }, 3400); }
function abrirModal(tit, std, html){ $("#mTit").textContent = tit; $("#mStd").textContent = std||""; $("#mStd").style.display = std ? "" : "none"; $("#mCuerpo").innerHTML = html; $("#fondo").classList.add("abierto"); $("#fondo .cerrar").focus(); }
function cerrarModal(){ $("#fondo").classList.remove("abierto"); }
function abrirInfo(k){ const x = INFO[k]; if(!x) return; const c = x[LANG] || x.es; abrirModal(c[0], x.std, c[1]); }
function abrirGuia(){ abrirModal(t("guia"), "SCA 102–105 · SCA 2004", ["dif","prep","partes","lotes","sesion"].map(function(k){ const c = INFO[k][LANG] || INFO[k].es; return "<h3>"+c[0]+"</h3>"+c[1]; }).join("")); }
function descargar(blob, nombre){ const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 150); }
function nombreArchivo(ext){ const b = (S.lotes.length===1 ? (lote().nombre || lote().codigo) : (S.sesion.fecha || "lotes")).replace(/[^\w\-áéíóúüñÁÉÍÓÚÜÑ ]+/g,"").trim().replace(/\s+/g,"_").slice(0,48) || "evaluacion"; return "CTCx_"+(S.metodo==="sca"?"SCA2004":"CVA")+"_"+b+"."+ext; }
// Una celda que empieza por = + - @ la ejecutaría una hoja de cálculo como fórmula: se le antepone un apóstrofo (los números no).
function csvCelda(v){ v = String(v==null?"":v); if(/^[=+@-]/.test(v) && isNaN(Number(v))) v = "'"+v; return /[",;\n\r]/.test(v) ? "\""+v.replace(/"/g,"\"\"")+"\"" : v; }
function exportarCsv(){
  const cab = ["codigo","nombre","metodo","puntaje","defectos_cat1","defectos_cat2","defectos_total","humedad","aw","densidad","pais","region","finca","productor","variedades","proceso","notas"];
  const filas = S.lotes.map(function(l){
    const d = calcDefectos(l.fis_def), p = puntajeLote(l), ns = (S.metodo==="sca" ? l.sca_rueda : l.cva_desc_nariz.concat(l.cva_desc_boca)).filter(function(x,i,a){ return a.indexOf(x)===i; }).map(nombreId).join(" | ");
    return [l.codigo, l.nombre, S.metodo==="sca"?"SCA 2004":"CVA", p==null?"":p.toFixed(2), d.cat1, d.cat2, d.total, l.fis_humedad, l.fis_aw, l.fis_densidad, l.ext.pais, l.ext.region, l.ext.finca, l.ext.productor, variedadesTx(l), procesoTx(l), ns].map(csvCelda).join(",");
  });
  descargar(new Blob(["﻿"+cab.join(",")+"\r\n"+filas.join("\r\n")], { type:"text/csv;charset=utf-8" }), nombreArchivo("csv"));
}
function exportarHtml(){
  const css = document.querySelector("style").textContent, cuerpo = UI.ficha==="todos" && S.lotes.length>1 ? S.lotes.map(fichaHTML).join("") : fichaHTML(lote());
  const doc = "<!DOCTYPE html><html lang=\""+LANG+"\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>"+esc(t("fiCo")+" · "+(lote().nombre||lote().codigo))+"</title><style>"+css+" body{background:#fff;padding:18px}</style></head><body data-m=\""+S.metodo+"\">"+cuerpo+"</body></html>";
  descargar(new Blob([doc], { type:"text/html;charset=utf-8" }), nombreArchivo("html"));
}
function codigoLibre(){ let n = S.lotes.length+1, c; do { c = "L"+String(n).padStart(2,"0"); n++; } while(S.lotes.some(function(l){ return l.codigo===c; })); return c; }
function quitarNota(lista, id){
  const l = lote(), arr = l[lista]; if(!Array.isArray(arr)) return;
  const i = arr.indexOf(id); if(i<0) return; arr.splice(i,1);
  if(lista.indexOf("cva_desc_")===0){
    const cata = l["cva_cata_"+lista.replace("cva_desc_","")], caja = cajaDe(id);
    if(caja && !arr.some(function(d){ return cajaDe(d)===caja; })){ const j = cata.indexOf(caja); if(j>=0) cata.splice(j,1); }
  }
}
function accion(a, d, el, ev){
  const l = lote();
  switch(a){
    case "lang": S.lang = LANG = d.v; pintar(); cambio(); break;
    case "info": ev.preventDefault(); abrirInfo(d.v); break;
    case "guia": abrirGuia(); break;
    case "cerrar": cerrarModal(); break;
    case "elegir": UI.elegir = true; pintar(); window.scrollTo(0,0); break;
    case "metodo": S.metodo = d.v; UI.elegir = false; pintar(); cambio(); window.scrollTo(0,0); break;
    case "acc": UI.acc[d.v] = !UI.acc[d.v]; pintar(); break;
    case "lote": S.actual = +d.v; pintar(); cambio(); break;
    case "masLote": case "dupLote": {
      if(S.lotes.length>=MAX_LOTES){ toast(t("topeLotes", MAX_LOTES), true); break; }
      const n = a==="dupLote" ? normLote(JSON.parse(JSON.stringify(l)), S.lotes.length) : loteVacio(S.lotes.length);
      n.codigo = codigoLibre(); S.lotes.push(n); S.actual = S.lotes.length-1; pintar(); cambio();
      if(S.lotes.length===7) toast(t("muchosLotes"));
      break; }
    case "delLote": if(S.lotes.length>1 && window.confirm(t("delLoteConf", l.codigo))){ S.lotes.splice(S.actual,1); S.actual = Math.max(0, S.actual-1); pintar(); cambio(); } break;
    case "parte": {
      const sig = !S.partes[d.v];
      if(!sig && ["basico","sabor","fisico","extr"].filter(function(p){ return S.partes[p]; }).length<2){ toast(t("unaParte"), true); break; }
      S.partes[d.v] = sig; pintar(); cambio(); break; }
    case "tab": UI.tab = d.v; pintar(); break;
    case "seg": { const cur = String(leer(l, d.k)==null ? "" : leer(l, d.k)); poner(l, d.k, cur===d.v ? "" : d.v); pintarPanel(); cambio(); break; }
    case "borra": poner(l, d.v, ""); pintarPanel(); cambio(); break;
    case "scaTz": { const tz = l.sca_tazas[+d.v]; tz.estado = tz.estado===d.i ? "" : d.i; if(!tz.estado) tz.defecto = ""; sincScaTazas(l); pintarPanel(); cambio(); break; }
    case "marca": UI.marca = UI.marca===d.v ? "" : d.v; pintarPanel(); break;
    case "mEtapa": { const x = l.rueda_detalle[d.v]; if(x){ x.etapas = alternaEtapa(x.etapas, d.i); pintarPanel(); cambio(); } break; }
    case "aff": l["cva_"+d.v] = numO(l["cva_"+d.v])===+d.i ? "" : String(+d.i); pintarPanel(); cambio(); break;
    case "caja": tocarCaja(d.i, d.v); podaDetalle(l); pintarPanel(); cambio(); break;
    // «Elija una» (tope 1): tocar otra la reemplaza; tocar la misma la quita.
    case "tope": if(+d.i===1){ const arr = l[d.k], era = arr[0]===d.v; arr.length = 0; if(!era) arr.push(d.v); } else tocarTope(l[d.k], d.v, +d.i); pintarPanel(); cambio(); break;
    case "tzNu": { const tz = l.cva_tazas[+d.v]; if(tz.defectuosa) break; tz.noUniforme = !tz.noUniforme; pintarPanel(); cambio(); break; }
    case "tzDef": { const tz = l.cva_tazas[+d.v]; tz.defectuosa = !tz.defectuosa; if(tz.defectuosa) tz.noUniforme = true; else tz.defecto = ""; pintarPanel(); cambio(); break; }
    // V5.137 · la nota recién marcada llega con su detalle abierto (etapa e intensidad), como en la planilla.
    case "nota": { UI.ultima = d.v; tocarNota(d.v); podaDetalle(l); const cl = (S.metodo==="cva" ? (UI.etapa==="boca" ? "boca:" : "nariz:") : "")+d.v; UI.marca = l.rueda_detalle[cl] ? cl : ""; pintarPanel(); cambio(); break; }
    case "quita": quitarNota(d.i, d.v); podaDetalle(l); pintarPanel(); cambio(); break;
    case "etapa": UI.etapa = d.v; pintarPanel(); break;
    case "vista": UI.vista = d.v; pintarPanel(); break;
    case "irRueda": { UI.etapa = d.v; pintarPanel(); const tr = $("#tarjetaRueda"); if(tr) tr.scrollIntoView({ behavior:"smooth", block:"start" }); break; }
    case "masVar": if(l.ext.variedades.length<8){ l.ext.variedades.push({ n:"", p:"" }); pintarPanel(); cambio(); } break;
    case "delVar": l.ext.variedades.splice(+d.v,1); if(!l.ext.variedades.length) l.ext.variedades.push({ n:"", p:"" }); pintarPanel(); cambio(); break;
    case "cert": l.ext.certs[d.v] = !l.ext.certs[d.v]; pintarPanel(); cambio(); break;
    case "fichaVer": UI.ficha = d.v; pintarPanel(); break;
    case "imprimir": if(UI.tab!=="ficha"){ UI.tab = "ficha"; pintar(); } setTimeout(function(){ window.print(); }, 200); break;
    case "html": exportarHtml(); break;
    case "csv": exportarCsv(); break;
    case "guardar": descargar(new Blob([JSON.stringify({ app:APP, v:VER, estado:S }, null, 1)], { type:"application/json" }), nombreArchivo("json")); toast(t("guardado")); break;
    case "cargar": $("#archivo").click(); break;
    case "nuevo": if(window.confirm(t("nuevoConf"))){ const lg = LANG; S = estadoVacio(); S.lang = lg; UI.tab = "sabor"; UI.elegir = false; pintar(); cambio(); window.scrollTo(0,0); } break;
  }
}
document.addEventListener("click", function(ev){
  const b = ev.target.closest ? ev.target.closest("[data-a]") : null;
  if(b){ accion(b.dataset.a, b.dataset, b, ev); return; }
  if(ev.target.id==="fondo"){ cerrarModal(); return; }
  // Un deslizador sin calificar se califica también con un toque en su posición actual.
  const r = ev.target.closest ? ev.target.closest("[data-rango]") : null;
  if(r && numO(leer(lote(), r.dataset.k))==null){ poner(lote(), r.dataset.k, r.value); refrescar(); cambio(); }
});
document.addEventListener("input", function(ev){
  const el = ev.target; if(!el || !el.dataset) return;
  if(el.dataset.busca!=null){ UI.busca = el.value; const br = $("#buscaRes"); if(br) br.innerHTML = buscaHTML(); return; }
  if(el.dataset.k!=null) poner(lote(), el.dataset.k, el.value);
  else if(el.dataset.s!=null) S.sesion[el.dataset.s] = el.value;
  else return;
  refrescar(); cambio();
  if(UI.tab==="ficha"){ clearTimeout(tFicha); tFicha = setTimeout(pintarPanel, 450); }
});
document.addEventListener("change", function(ev){
  const el = ev.target; if(!el || !el.dataset || el.dataset.k==null || el.tagName!=="SELECT") return;
  poner(lote(), el.dataset.k, el.value);
  if(el.dataset.k==="sca_num_tazas"){ ajustaTazasSca(lote()); pintarPanel(); cambio(); return; } /* V5.147: cambia cuántas tazas se pintan */
  refrescar(); cambio();
});
document.addEventListener("keydown", function(ev){
  if(ev.key==="Escape"){ cerrarModal(); return; }
  if((ev.key==="Enter" || ev.key===" ") && ev.target.getAttribute && ev.target.getAttribute("role")==="button" && ev.target.dataset.a){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("mouseover", function(ev){
  const w = ev.target.closest ? ev.target.closest(".rueda .w") : null, dr = $("#diceRueda");
  if(w && dr) dr.innerHTML = "<b>"+esc(rutaId(w.dataset.v))+"</b><br>"+esc(descId(w.dataset.v));
});
$("#archivo").addEventListener("change", function(ev){
  const f = ev.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const o = JSON.parse(fr.result);
      if(!o || o.app!==APP || !o.estado) throw new Error("otro");
      S = normalizar(o.estado); LANG = S.lang; UI.elegir = false; pintar(); cambio(); toast(t("cargado"));
    }catch(e){ toast(t("cargaMal"), true); }
  };
  fr.readAsText(f); ev.target.value = "";
});
window.addEventListener("resize", function(){ document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight+"px"); });

   Fuera de la concha el borrador vive en el navegador; dentro, el trabajo lo
   guarda la plataforma por el puente (esquema propio: el estado entero).

let LANG_URL = "";
try{ const q = new URLSearchParams(window.location.search).get("lang"); if(IDIOMAS.indexOf(q)>=0) LANG_URL = q; }catch(e){ /* sin URL legible */ }
(function(){ const n = String(navigator.language||"es").slice(0,2).toLowerCase(); LANG = LANG_URL || (IDIOMAS.indexOf(n)>=0 ? n : "es"); })();
S = estadoVacio();
if(!ENCONCHA){ try{ const b = localStorage.getItem(LS); if(b){ S = normalizar(JSON.parse(b)); if(LANG_URL) S.lang = LANG_URL; } }catch(e){ S = estadoVacio(); } }
pintar();
document.addEventListener("DOMContentLoaded", function(){
  if(!window.CTC || !window.CTC.usarEstado) return;
  window.CTC.usarEstado(
    function(){ return JSON.parse(JSON.stringify(S)); },

  );
  window.CTC.usarResumen(resumen);
