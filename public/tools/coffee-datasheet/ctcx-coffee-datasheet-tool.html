/* ═══════════════════════════════════════════════════════════════════════════
   2. LOS BOTONES «i» — qué es cada casilla y de qué estándar sale.
   [título, cuerpo] por idioma; `std` es la fuente que se enseña en el pop-up.
   Fuentes: SCA Standards 102-2024, 103-2024, 104-2024, 105-2025 y los formatos
   CVA en español (sca.coffee/value-assessment); protocolo de catación SCA 2004.
   ═══════════════════════════════════════════════════════════════════════════ */
const INFO = {
  dif:{ std:"SCA 102–105 · SCA 2004",
    es:["SCA 2004 y CVA no son lo mismo","<p>Las dos vienen de la Specialty Coffee Association, y por eso se confunden.</p><p><b>SCA 2004</b> es el protocolo de catación clásico: diez atributos que se suman en <b>un solo puntaje de 0 a 100</b>. En ese número van mezcladas dos cosas: cómo es el café y qué tanto le gusta al catador.</p><p><b>CVA</b> (Coffee Value Assessment, estándares SCA 102 a 105, publicados en 2024 y 2025) reemplaza al protocolo de 2004 y separa cuatro evaluaciones: <b>física</b> (el grano verde), <b>descriptiva</b> (qué hay y cuánto, sin opinar), <b>afectiva</b> (qué tan alta es la impresión de calidad; es la única que produce puntaje) y <b>extrínseca</b> (lo que se sabe del café: origen, proceso, comercio, certificaciones).</p><p>Un 84 del formulario 2004 y un 84 del CVA <b>no son comparables</b>: salen de escalas y fórmulas distintas. Por eso esta herramienta te hace elegir un método y lo deja escrito en cada pantalla y en la ficha.</p>"],
    en:["SCA 2004 and CVA are not the same","<p>Both come from the Specialty Coffee Association, which is why they get confused.</p><p><b>SCA 2004</b> is the classic cupping protocol: ten attributes added into <b>a single score from 0 to 100</b>. That number blends two things: what the coffee is like and how much the cupper likes it.</p><p><b>CVA</b> (Coffee Value Assessment, SCA Standards 102 to 105, published in 2024 and 2025) supersedes the 2004 protocol and separates four assessments: <b>physical</b> (the green bean), <b>descriptive</b> (what is there and how much, with no judgement), <b>affective</b> (how high the impression of quality is; the only one that yields a score) and <b>extrinsic</b> (what is known about the coffee: origin, process, trade, certifications).</p><p>An 84 on the 2004 form and an 84 on the CVA are <b>not comparable</b>: they come from different scales and formulas. That is why this tool makes you pick a method and states it on every screen and on the datasheet.</p>"],
    de:["SCA 2004 und CVA sind nicht dasselbe","<p>Beide stammen von der Specialty Coffee Association – deshalb werden sie verwechselt.</p><p><b>SCA 2004</b> ist das klassische Cupping-Protokoll: zehn Attribute, die zu <b>einer einzigen Punktzahl von 0 bis 100</b> addiert werden. In dieser Zahl stecken zwei Dinge: wie der Kaffee ist und wie sehr er dem Verkoster gefällt.</p><p><b>CVA</b> (Coffee Value Assessment, SCA-Standards 102 bis 105, veröffentlicht 2024 und 2025) ersetzt das Protokoll von 2004 und trennt vier Bewertungen: <b>physisch</b> (die rohe Bohne), <b>deskriptiv</b> (was vorhanden ist und wie viel, ohne Urteil), <b>affektiv</b> (wie hoch der Qualitätseindruck ist; nur sie ergibt eine Punktzahl) und <b>extrinsisch</b> (was über den Kaffee bekannt ist: Herkunft, Aufbereitung, Handel, Zertifizierungen).</p><p>Eine 84 auf dem Formular von 2004 und eine 84 im CVA sind <b>nicht vergleichbar</b>: Sie stammen aus unterschiedlichen Skalen und Formeln. Deshalb lässt dieses Werkzeug Sie eine Methode wählen und nennt sie auf jedem Bildschirm und im Datenblatt.</p>"] },
  prep:{ std:"SCA 102-2024",
    es:["Preparación de la muestra y mecánica de catación","<p>La preparación es la misma para los dos métodos en lo esencial; el estándar SCA 102 (2024) es el vigente.</p><ul><li><b>Tueste:</b> medio, de catación — lectura Agtron «Gourmet» 63 (L* 26–29). Reposo de 8 a 24 horas.</li><li><b>Dosis:</b> 8,25 g de café por cada 150 mL de capacidad de la taza (± 0,2 g), cada taza pesada y molida por separado.</li><li><b>Molienda:</b> 70–75 % pasa por malla 20 US (850 µm).</li><li><b>Agua:</b> 93 ± 3 °C, hasta el borde.</li><li><b>Tazas:</b> cinco por muestra para la afectiva y para el formulario 2004 (así se puede juzgar la uniformidad); de tres a cinco para la descriptiva.</li><li><b>Pasos:</b> fragancia en seco → agua y aroma con la costra intacta → romper la costra a los 3–5 minutos → limpiar → probar desde unos 70 °C, al menos tres rondas mientras enfría.</li><li><b>Sesión:</b> máximo 6 cafés.</li></ul><p>Si la muestra no está en tueste medio o hubo otra desviación, se informa a todas las partes.</p>"],
    en:["Sample preparation and tasting mechanics","<p>Preparation is essentially the same for both methods; SCA Standard 102 (2024) is the one in force.</p><ul><li><b>Roast:</b> medium, cupping level — Agtron “Gourmet” reading of 63 (L* 26–29). Rest for 8 to 24 hours.</li><li><b>Dose:</b> 8.25 g of coffee per 150 mL of cup capacity (± 0.2 g), each cup weighed and ground separately.</li><li><b>Grind:</b> 70–75 % passes a US 20 mesh sieve (850 µm).</li><li><b>Water:</b> 93 ± 3 °C, poured to the rim.</li><li><b>Cups:</b> five per sample for the affective assessment and for the 2004 form (so uniformity can be judged); three to five for the descriptive one.</li><li><b>Steps:</b> dry fragrance → water and aroma with the crust intact → break the crust at 3–5 minutes → skim → taste from about 70 °C, at least three rounds as it cools.</li><li><b>Session:</b> 6 coffees at most.</li></ul><p>If the sample is not at a medium roast, or any other deviation occurs, all parties must be told.</p>"],
    de:["Probenvorbereitung und Verkostungsablauf","<p>Die Vorbereitung ist für beide Methoden im Wesentlichen gleich; maßgeblich ist der SCA-Standard 102 (2024).</p><ul><li><b>Röstung:</b> mittel, Cupping-Niveau – Agtron-«Gourmet»-Wert 63 (L* 26–29). 8 bis 24 Stunden ruhen lassen.</li><li><b>Dosierung:</b> 8,25 g Kaffee pro 150 mL Tassenvolumen (± 0,2 g), jede Tasse einzeln gewogen und gemahlen.</li><li><b>Mahlgrad:</b> 70–75 % passieren ein US-20-Mesh-Sieb (850 µm).</li><li><b>Wasser:</b> 93 ± 3 °C, bis zum Rand.</li><li><b>Tassen:</b> fünf pro Probe für die affektive Bewertung und für das Formular von 2004 (damit die Gleichmäßigkeit beurteilt werden kann); drei bis fünf für die deskriptive.</li><li><b>Schritte:</b> trockene Fragrance → Wasser und Aroma bei intakter Kruste → Kruste nach 3–5 Minuten brechen → abschöpfen → ab etwa 70 °C verkosten, mindestens drei Runden beim Abkühlen.</li><li><b>Sitzung:</b> höchstens 6 Kaffees.</li></ul><p>Ist die Probe nicht mittel geröstet oder gibt es eine andere Abweichung, werden alle Beteiligten informiert.</p>"] },
  sesion:{ std:"SCA 103 · 104 · 105",
    es:["Datos de la sesión","<p>Nombre, fecha y objetivo encabezan todos los formatos. El <b>objetivo</b> importa: en la evaluación afectiva el catador califica según su preferencia o según la de un mercado que conoce, y quien lea la ficha necesita saber cuál.</p><p>Para evaluar con el CVA <b>no hace falta un certificado</b>: los estándares y formatos son abiertos. Si tu evaluación debe pesar ante compradores o concursos, la credencial que el gremio reconoce es la licencia Q Grader de la SCA; si tienes SCA ID o licencia, anótala aquí.</p>"],
    en:["Session details","<p>Name, date and purpose head every form. The <b>purpose</b> matters: in the affective assessment the cupper rates according to their own preference or that of a market they know, and whoever reads the datasheet needs to know which.</p><p>You do <b>not need a certificate</b> to assess with the CVA: the standards and forms are open. If your assessment must carry weight with buyers or competitions, the credential the trade recognises is the SCA Q Grader license; if you have an SCA ID or license, note it here.</p>"],
    de:["Sitzungsdaten","<p>Name, Datum und Zweck stehen am Kopf aller Formulare. Der <b>Zweck</b> ist wichtig: In der affektiven Bewertung urteilt der Verkoster nach eigener Vorliebe oder nach der eines ihm bekannten Marktes – wer das Datenblatt liest, muss wissen, welche.</p><p>Für eine Bewertung mit dem CVA ist <b>kein Zertifikat nötig</b>: Standards und Formulare sind frei zugänglich. Soll Ihre Bewertung bei Käufern oder Wettbewerben Gewicht haben, ist die in der Branche anerkannte Qualifikation die Q-Grader-Lizenz der SCA; tragen Sie hier Ihre SCA-ID oder Lizenz ein, falls vorhanden.</p>"] },
  lotes:{ std:"SCA 102-2024 · 7.2",
    es:["Uno o varios lotes","<p>Cada lote es una muestra con su propio perfil, su granulometría y su parte extrínseca. Puedes entrar y salir de cada uno para catarlos en paralelo, como en la mesa: primero la fragancia de todos, luego el aroma, luego la boca.</p><p>El <b>código</b> es el número de muestra de los formatos: úsalo para catar a ciegas y deja el nombre para después. El estándar recomienda un máximo de <b>6 cafés por sesión</b>.</p>"],
    en:["One lot or several","<p>Each lot is a sample with its own profile, physical data and extrinsic part. You can move in and out of each one to cup them in parallel, as at the table: fragrance for all first, then aroma, then the mouth.</p><p>The <b>code</b> is the sample number on the forms: use it to cup blind and leave the name for later. The standard recommends a maximum of <b>6 coffees per session</b>.</p>"],
    de:["Eine Partie oder mehrere","<p>Jede Partie ist eine Probe mit eigenem Profil, eigenen physischen Daten und eigenem extrinsischem Teil. Sie können zwischen den Partien wechseln, um sie parallel zu verkosten – wie am Tisch: zuerst die Fragrance aller Proben, dann das Aroma, dann der Mund.</p><p>Der <b>Code</b> ist die Probennummer der Formulare: Nutzen Sie ihn für die Blindverkostung und ergänzen Sie den Namen später. Der Standard empfiehlt höchstens <b>6 Kaffees pro Sitzung</b>.</p>"] },
  partes:{ std:"SCA 105-2025 · 5.2",
    es:["Las tres partes","<p>Puedes llenar una, dos o las tres: <b>Perfil de sabores</b> (la taza), <b>Granulometría</b> (el grano verde: defectos, humedad, tamaño) y <b>Caracterización extrínseca</b> (lo que se sabe del café). Una parte apagada no aparece ni en pantalla ni en la ficha; lo que ya tenía llenado no se borra.</p><p>El estándar pide mantener la información extrínseca <b>separada</b> de la evaluación sensorial para no sesgarla, y reunir todo en un solo expediente al final. Pueden hacerlas personas distintas.</p>"],
    en:["The three parts","<p>You can fill in one, two or all three: <b>Flavour profile</b> (the cup), <b>Physical grading</b> (the green bean: defects, moisture, size) and <b>Extrinsic characterisation</b> (what is known about the coffee). A part that is switched off shows neither on screen nor on the datasheet; what was already filled in is not deleted.</p><p>The standard asks that extrinsic information be kept <b>separate</b> from the sensory assessment so as not to bias it, and that everything be compiled into a single dossier at the end. Different people may complete them.</p>"],
    de:["Die drei Teile","<p>Sie können einen, zwei oder alle drei ausfüllen: <b>Geschmacksprofil</b> (die Tasse), <b>Physische Analyse</b> (die rohe Bohne: Defekte, Feuchte, Größe) und <b>Extrinsische Charakterisierung</b> (was über den Kaffee bekannt ist). Ein ausgeschalteter Teil erscheint weder auf dem Bildschirm noch im Datenblatt; bereits Ausgefülltes wird nicht gelöscht.</p><p>Der Standard verlangt, extrinsische Informationen von der sensorischen Bewertung <b>getrennt</b> zu halten, um sie nicht zu beeinflussen, und am Ende alles in einem Dossier zusammenzuführen. Verschiedene Personen können sie ausfüllen.</p>"] },
  tueste:{ std:"SCA 102-2024 · 5.1 · SCA 103 · 6.1",
    es:["Nivel de tueste","<p>Antes de catar se estima a la vista el nivel de tueste de la muestra y se anota. El de catación es <b>medio</b>: lectura Agtron «Gourmet» de 63. Un tueste distinto cambia la taza, así que se declara.</p><p>Si quieres medirlo, el <a href=\"/tools/agtron/agtron-dial.html\" target=\"_blank\" rel=\"noopener\">Disco Agtron</a> del taller lo lee desde una foto.</p>"],
    en:["Roast level","<p>Before cupping, the sample's roast level is estimated visually and recorded. Cupping level is <b>medium</b>: an Agtron “Gourmet” reading of 63. A different roast changes the cup, so it is declared.</p><p>If you want to measure it, the workshop's <a href=\"/tools/agtron/agtron-dial.html\" target=\"_blank\" rel=\"noopener\">Agtron Dial</a> reads it from a photo.</p>"],
    de:["Röstgrad","<p>Vor dem Cupping wird der Röstgrad der Probe visuell geschätzt und notiert. Cupping-Niveau ist <b>mittel</b>: Agtron-«Gourmet»-Wert 63. Eine andere Röstung verändert die Tasse und wird deshalb angegeben.</p><p>Zum Messen liest die <a href=\"/tools/agtron/agtron-dial.html\" target=\"_blank\" rel=\"noopener\">Agtron-Scheibe</a> der Werkstatt den Wert aus einem Foto.</p>"] },
  rueda:{ std:"SCA/WCR Flavor Wheel · SCA 103 · 5.1",
    es:["La rueda de sabores","<p>Tres anillos, de adentro hacia afuera: <b>familia</b>, <b>subcategoría</b> y <b>descriptor</b>. Cata primero en amplio («es frutal») y avanza hacia el borde para precisar («es una baya… es frambuesa»).</p><p>Es la misma rueda de la Rueda del Café del taller y de la planilla del Centro de Calidad: una sola taxonomía, inspirada en la Coffee Taster's Flavor Wheel de la SCA y World Coffee Research.</p><p>Con <b>SCA 2004</b> las notas son libres. Con <b>CVA</b>, cada nota que toques marca la casilla CATA de su categoría en la lista que tengas activa (nariz o boca) y queda escrita como descriptor.</p>"],
    en:["The flavour wheel","<p>Three rings, from the inside out: <b>family</b>, <b>subcategory</b> and <b>descriptor</b>. Taste broadly first (“it is fruity”) and move towards the rim to get specific (“it is a berry… it is raspberry”).</p><p>It is the same wheel as the workshop's Coffee Wheel and the Quality Centre's scoresheet: a single taxonomy, inspired by the SCA and World Coffee Research Coffee Taster's Flavor Wheel.</p><p>With <b>SCA 2004</b> the notes are free. With <b>CVA</b>, each note you tap ticks the CATA box for its category in whichever list is active (nose or mouth) and is recorded as a descriptor.</p>"],
    de:["Das Aromarad","<p>Drei Ringe, von innen nach außen: <b>Familie</b>, <b>Unterkategorie</b> und <b>Deskriptor</b>. Verkosten Sie zuerst grob («es ist fruchtig») und gehen Sie zum Rand, um genauer zu werden («eine Beere … Himbeere»).</p><p>Es ist dasselbe Rad wie im Kaffeerad der Werkstatt und im Bewertungsbogen des Qualitätszentrums: eine einzige Taxonomie, angelehnt an das Coffee Taster's Flavor Wheel von SCA und World Coffee Research.</p><p>Bei <b>SCA 2004</b> sind die Noten frei. Bei <b>CVA</b> kreuzt jede angetippte Note das CATA-Feld ihrer Kategorie in der aktiven Liste (Nase oder Mund) an und wird als Deskriptor festgehalten.</p>"] },

  /* ── SCA 2004 ── */
  sca_esc:{ std:"SCA 2004",
    es:["La escala de 6 a 10","<p>Los siete atributos con escala se califican de <b>6,00 a 10,00 en pasos de 0,25</b>: 6 = bueno, 7 = muy bueno, 8 = excelente, 9 = sobresaliente. Por debajo de 6 el café no es de especialidad y el formulario no baja más.</p><p>Aquí la calificación es de <b>calidad</b>: describes y juzgas en el mismo número. Es la diferencia de fondo con el CVA, que separa las dos cosas.</p>"],
    en:["The 6 to 10 scale","<p>The seven scaled attributes are rated from <b>6.00 to 10.00 in 0.25 steps</b>: 6 = good, 7 = very good, 8 = excellent, 9 = outstanding. Below 6 the coffee is not specialty and the form goes no lower.</p><p>Here the rating is one of <b>quality</b>: you describe and judge in the same number. That is the core difference from the CVA, which separates the two.</p>"],
    de:["Die Skala von 6 bis 10","<p>Die sieben skalierten Attribute werden von <b>6,00 bis 10,00 in 0,25er-Schritten</b> bewertet: 6 = gut, 7 = sehr gut, 8 = ausgezeichnet, 9 = herausragend. Unter 6 ist der Kaffee keine Spezialität, tiefer reicht das Formular nicht.</p><p>Hier ist die Bewertung eine <b>Qualitätsbewertung</b>: Sie beschreiben und urteilen in derselben Zahl. Das ist der grundlegende Unterschied zum CVA, das beides trennt.</p>"] },
  sca_fragrance:{ std:"SCA 2004",
    es:["Fragancia / Aroma","<p>Un solo atributo en el formulario 2004. Se evalúa en tres momentos: el olor del café molido en seco (fragancia), el de la costra al romperla y el de la bebida mientras reposa (aroma).</p><p>En el CVA son dos secciones separadas.</p>"],
    en:["Fragrance / Aroma","<p>A single attribute on the 2004 form. It is assessed at three moments: the smell of the dry grounds (fragrance), of the crust as it is broken, and of the brew as it steeps (aroma).</p><p>In the CVA these are two separate sections.</p>"],
    de:["Fragrance / Aroma","<p>Im Formular von 2004 ein einziges Attribut. Es wird zu drei Zeitpunkten beurteilt: der Geruch des trockenen Mahlguts (Fragrance), der Kruste beim Brechen und des Aufgusses beim Ziehen (Aroma).</p><p>Im CVA sind es zwei getrennte Abschnitte.</p>"] },
  sca_flavor:{ std:"SCA 2004",
    es:["Sabor","<p>La impresión principal del café en la boca: la suma del gusto y del aroma retronasal, entre la primera impresión y el sabor residual. Se califica su intensidad, calidad y complejidad.</p>"],
    en:["Flavor","<p>The coffee's main character in the mouth: the combination of taste and retronasal aroma, between the first impression and the aftertaste. Its intensity, quality and complexity are rated.</p>"],
    de:["Geschmack","<p>Der Hauptcharakter des Kaffees im Mund: die Verbindung von Geschmack und retronasalem Aroma, zwischen erstem Eindruck und Nachgeschmack. Bewertet werden Intensität, Qualität und Komplexität.</p>"] },
  sca_aftertaste:{ std:"SCA 2004",
    es:["Sabor residual","<p>Lo que queda en el paladar después de expulsar o tragar el café, y cuánto dura. Un sabor residual corto o desagradable baja la calificación.</p>"],
    en:["Aftertaste","<p>What remains on the palate after the coffee is expelled or swallowed, and how long it lasts. A short or unpleasant aftertaste lowers the rating.</p>"],
    de:["Nachgeschmack","<p>Was am Gaumen bleibt, nachdem der Kaffee ausgespuckt oder geschluckt wurde, und wie lange es anhält. Ein kurzer oder unangenehmer Nachgeschmack senkt die Bewertung.</p>"] },
  sca_acidity:{ std:"SCA 2004",
    es:["Acidez","<p>Se califica la <b>calidad</b> de la acidez —brillante cuando es favorable, agria cuando no—, no cuánta hay. Su intensidad (alta, media, baja) se anota aparte y <b>no suma ni resta</b>: una acidez alta puede ser lo esperado en un origen y un exceso en otro.</p>"],
    en:["Acidity","<p>What is rated is the <b>quality</b> of the acidity — bright when favourable, sour when not — not how much there is. Its intensity (high, medium, low) is noted separately and <b>neither adds nor subtracts</b>: high acidity may be expected in one origin and excessive in another.</p>"],
    de:["Säure","<p>Bewertet wird die <b>Qualität</b> der Säure – brillant, wenn sie angenehm ist, sauer, wenn nicht – und nicht ihre Menge. Die Intensität (hoch, mittel, niedrig) wird gesondert notiert und <b>zählt weder positiv noch negativ</b>: Hohe Säure kann bei einer Herkunft erwartet und bei einer anderen zu viel sein.</p>"] },
  sca_body:{ std:"SCA 2004",
    es:["Cuerpo","<p>La sensación táctil del líquido en la boca, sobre todo entre la lengua y el paladar. Se califica su <b>calidad</b>; el nivel (pesado, medio, ligero) se anota aparte y no suma ni resta: un cuerpo ligero puede ser tan bueno como uno pesado.</p><p>En el CVA esta sección se llama «sensación en boca» y abarca también la textura y la astringencia.</p>"],
    en:["Body","<p>The tactile feel of the liquid in the mouth, especially between the tongue and the roof of the mouth. Its <b>quality</b> is rated; the level (heavy, medium, thin) is noted separately and neither adds nor subtracts: a light body can be as good as a heavy one.</p><p>In the CVA this section is called “mouthfeel” and also covers texture and astringency.</p>"],
    de:["Körper","<p>Das taktile Gefühl der Flüssigkeit im Mund, vor allem zwischen Zunge und Gaumen. Bewertet wird die <b>Qualität</b>; das Niveau (schwer, mittel, leicht) wird gesondert notiert und zählt weder positiv noch negativ: Ein leichter Körper kann so gut sein wie ein schwerer.</p><p>Im CVA heißt dieser Abschnitt «Mundgefühl» und umfasst auch Textur und Adstringenz.</p>"] },
  sca_balance:{ std:"SCA 2004",
    es:["Balance","<p>Cómo se complementan o contrastan el sabor, el sabor residual, la acidez y el cuerpo. Si a la muestra le falta alguno o uno domina a los demás, el balance baja.</p><p>El CVA no tiene esta casilla: el balance entra en la impresión global.</p>"],
    en:["Balance","<p>How flavor, aftertaste, acidity and body complement or contrast with each other. If the sample lacks one of them, or one overpowers the rest, balance drops.</p><p>The CVA has no such box: balance is part of the overall impression.</p>"],
    de:["Balance","<p>Wie Geschmack, Nachgeschmack, Säure und Körper einander ergänzen oder kontrastieren. Fehlt der Probe eines davon oder dominiert eines die anderen, sinkt die Balance.</p><p>Das CVA hat dieses Feld nicht: Die Balance geht in den Gesamteindruck ein.</p>"] },
  sca_uniformity:{ std:"SCA 2004",
    es:["Uniformidad","<p>Consistencia del sabor entre las cinco tazas de la muestra. Cada taza igual a las demás vale 2 puntos; la que sabe distinto pierde los suyos.</p>"],
    en:["Uniformity","<p>Consistency of flavor across the sample's five cups. Each cup that matches the others is worth 2 points; a cup that tastes different loses its points.</p>"],
    de:["Gleichmäßigkeit","<p>Geschmackliche Übereinstimmung der fünf Tassen der Probe. Jede Tasse, die den anderen gleicht, zählt 2 Punkte; eine abweichende verliert ihre Punkte.</p>"] },
  sca_clean_cup:{ std:"SCA 2004",
    es:["Taza limpia","<p>Ausencia de impresiones negativas desde el primer sorbo hasta el sabor residual. 2 puntos por cada taza limpia; cualquier sabor o aroma ajeno al café descalifica la taza.</p>"],
    en:["Clean cup","<p>Absence of negative impressions from the first sip to the aftertaste. 2 points for each clean cup; any non-coffee taste or aroma disqualifies the cup.</p>"],
    de:["Saubere Tasse","<p>Keine negativen Eindrücke vom ersten Schluck bis zum Nachgeschmack. 2 Punkte für jede saubere Tasse; jeder kaffeefremde Geschmack oder Geruch disqualifiziert die Tasse.</p>"] },
  sca_sweetness:{ std:"SCA 2004",
    es:["Dulzor","<p>La plenitud agradable del sabor que dan ciertos carbohidratos; lo contrario es una taza agria, astringente o «verde». 2 puntos por cada taza que lo muestra.</p><p>En el CVA el dulzor tiene escala propia de intensidad y de impresión de calidad.</p>"],
    en:["Sweetness","<p>The pleasing fullness of flavor given by certain carbohydrates; its opposite is a sour, astringent or “green” cup. 2 points for each cup that shows it.</p><p>In the CVA sweetness has its own intensity and impression-of-quality scales.</p>"],
    de:["Süße","<p>Die angenehme Fülle des Geschmacks durch bestimmte Kohlenhydrate; das Gegenteil ist eine saure, adstringierende oder «grüne» Tasse. 2 Punkte für jede Tasse, die sie zeigt.</p><p>Im CVA hat die Süße eigene Skalen für Intensität und Qualitätseindruck.</p>"] },
  sca_cuppers:{ std:"SCA 2004",
    es:["Puntaje del catador","<p>La valoración integral y personal de la muestra: lo que el catador piensa del conjunto. Es el único atributo abiertamente subjetivo del formulario 2004.</p>"],
    en:["Overall (cupper's score)","<p>The cupper's holistic, personal rating of the sample: what they think of the whole. It is the only openly subjective attribute on the 2004 form.</p>"],
    de:["Gesamturteil des Verkosters","<p>Die ganzheitliche, persönliche Bewertung der Probe: was der Verkoster vom Ganzen hält. Es ist das einzige offen subjektive Attribut des Formulars von 2004.</p>"] },
  sca_def:{ std:"SCA 2004",
    es:["Defectos de taza","<p>Sabores negativos que restan calidad. <b>Leve (taint):</b> se nota, pero no domina; suele estar en lo aromático — 2 puntos por taza. <b>Grave (fault):</b> domina o hace la taza desagradable — 4 puntos por taza.</p><p>Se multiplica la intensidad por el número de tazas afectadas y el resultado se <b>resta</b> de la suma de los diez atributos.</p>"],
    en:["Cup defects","<p>Negative flavors that detract from quality. <b>Taint:</b> noticeable but not overwhelming, usually in the aromatics — 2 points per cup. <b>Fault:</b> overwhelming, or makes the cup unpalatable — 4 points per cup.</p><p>The intensity is multiplied by the number of cups affected and the result is <b>subtracted</b> from the sum of the ten attributes.</p>"],
    de:["Tassenfehler","<p>Negative Geschmäcker, die die Qualität mindern. <b>Taint (leicht):</b> spürbar, aber nicht dominant, meist in den Aromen – 2 Punkte pro Tasse. <b>Fault (schwer):</b> dominant oder macht die Tasse ungenießbar – 4 Punkte pro Tasse.</p><p>Die Intensität wird mit der Zahl der betroffenen Tassen multipliziert und das Ergebnis von der Summe der zehn Attribute <b>abgezogen</b>.</p>"] },
  sca_taint:{ std:"SCA 2004",
    es:["Defecto leve · taint","<p>Un sabor o un olor ajeno que <b>se nota pero no domina</b> la taza; suele estar en lo aromático.</p><p>Resta <b>2 puntos</b> por cada taza que lo tenga. Marca la taza y di cuál es el defecto.</p>"],
    en:["Taint","<p>An off-flavor or off-odor that is <b>noticeable but not overwhelming</b>, usually found in the aromatics.</p><p>It subtracts <b>2 points</b> for each cup that shows it. Mark the cup and say which defect it is.</p>"],
    de:["Leichter Fehler · Taint","<p>Ein Fehlgeschmack oder Fehlgeruch, der <b>spürbar, aber nicht dominant</b> ist; meist in den Aromen.</p><p>Er zieht <b>2 Punkte</b> für jede betroffene Tasse ab. Markieren Sie die Tasse und nennen Sie den Fehler.</p>"] },
  sca_fault:{ std:"SCA 2004",
    es:["Defecto grave · fault","<p>Un sabor ajeno que <b>domina la taza o la vuelve desagradable</b>; suele estar en el gusto.</p><p>Resta <b>4 puntos</b> por cada taza que lo tenga. Marca la taza y di cuál es el defecto.</p>"],
    en:["Fault","<p>An off-flavor that <b>overwhelms the cup or makes it unpalatable</b>, usually found in the taste.</p><p>It subtracts <b>4 points</b> for each cup that shows it. Mark the cup and say which defect it is.</p>"],
    de:["Schwerer Fehler · Fault","<p>Ein Fehlgeschmack, der <b>die Tasse dominiert oder ungenießbar macht</b>; meist im Geschmack.</p><p>Er zieht <b>4 Punkte</b> für jede betroffene Tasse ab. Markieren Sie die Tasse und nennen Sie den Fehler.</p>"] },
  cva_acidez:{ std:"SCA 103",
    es:["Tipo de acidez","<p>El formato descriptivo pide elegir <b>una</b>: <b>seca</b> —herbal, a pasto, agria— o <b>dulce</b> —jugosa, frutal, brillante—.</p><p>Describe el carácter de la acidez; su fuerza va en la escala de 0 a 15. No entra en el puntaje.</p>"],
    en:["Acidity type","<p>The descriptive form asks you to choose <b>one</b>: <b>dry</b> — herby, grassy, tart — or <b>sweet</b> — juicy, fruit-like, bright.</p><p>It describes the character of the acidity; its strength goes on the 0 to 15 scale. It does not enter the score.</p>"],
    de:["Art der Säure","<p>Das deskriptive Formular verlangt <b>eine</b> Auswahl: <b>trocken</b> – kräuterig, grasig, herb – oder <b>süß</b> – saftig, fruchtig, lebhaft.</p><p>Sie beschreibt den Charakter der Säure; ihre Stärke steht auf der Skala von 0 bis 15. Sie fließt nicht in die Punktzahl ein.</p>"] },
  sca_punt:{ std:"SCA 2004",
    es:["El puntaje SCA 2004","<p><b>Puntaje final = suma de los diez atributos − defectos.</b></p><p>Lectura del total: 90–100 sobresaliente · 85–89,99 excelente · 80–84,99 muy bueno · menos de 80, por debajo de la calidad de especialidad.</p><p>No hay puntaje hasta que los diez atributos están calificados: una suma a medias no es un puntaje.</p>"],
    en:["The SCA 2004 score","<p><b>Final score = sum of the ten attributes − defects.</b></p><p>Reading the total: 90–100 outstanding · 85–89.99 excellent · 80–84.99 very good · under 80, below specialty quality.</p><p>There is no score until all ten attributes are rated: a half-finished sum is not a score.</p>"],
    de:["Die SCA-2004-Punktzahl","<p><b>Endpunktzahl = Summe der zehn Attribute − Fehler.</b></p><p>Lesart der Summe: 90–100 herausragend · 85–89,99 ausgezeichnet · 80–84,99 sehr gut · unter 80 unterhalb der Spezialitätenqualität.</p><p>Eine Punktzahl gibt es erst, wenn alle zehn Attribute bewertet sind: Eine halbe Summe ist keine Punktzahl.</p>"] },

  /* ── CVA ── */
  cva_dos:{ std:"SCA 103-2024 · SCA 104-2024",
    es:["Dos columnas, dos preguntas","<p>Cada sección de la taza se responde dos veces, y las respuestas <b>no se copian</b> una de otra:</p><p><b>Descriptiva (izquierda):</b> «¿qué hay y cuánto?». Intensidad de 0 a 15 y casillas CATA. Es descripción objetiva: una acidez de 13 solo dice que hay mucha, no que sea buena.</p><p><b>Afectiva (derecha):</b> «¿qué tan alta es mi impresión de calidad?». De 1 a 9. Esa misma acidez intensa puede parecerte brillante (8) o agresiva (4).</p><p>Solo la afectiva produce puntaje. Hacerlas juntas, sección por sección, es la «evaluación combinada» del estándar.</p>"],
    en:["Two columns, two questions","<p>Each cup section is answered twice, and the answers are <b>not copied</b> from one another:</p><p><b>Descriptive (left):</b> “what is there, and how much?”. Intensity from 0 to 15 and CATA boxes. It is objective description: an acidity of 13 only says there is a lot of it, not that it is good.</p><p><b>Affective (right):</b> “how high is my impression of quality?”. From 1 to 9. That same intense acidity may strike you as bright (8) or harsh (4).</p><p>Only the affective part yields a score. Doing both together, section by section, is the standard's “combined assessment”.</p>"],
    de:["Zwei Spalten, zwei Fragen","<p>Jeder Tassenabschnitt wird zweimal beantwortet, und die Antworten werden <b>nicht voneinander abgeschrieben</b>:</p><p><b>Deskriptiv (links):</b> «Was ist da und wie viel?» Intensität von 0 bis 15 und CATA-Felder. Das ist objektive Beschreibung: Eine Säure von 13 sagt nur, dass viel davon da ist, nicht, dass sie gut ist.</p><p><b>Affektiv (rechts):</b> «Wie hoch ist mein Qualitätseindruck?» Von 1 bis 9. Dieselbe intensive Säure kann Ihnen brillant (8) oder aggressiv (4) erscheinen.</p><p>Nur der affektive Teil ergibt eine Punktzahl. Beide zusammen, Abschnitt für Abschnitt, sind die «kombinierte Bewertung» des Standards.</p>"] },
  cva_int:{ std:"SCA 103-2024 · 6.2",
    es:["Intensidad de 0 a 15","<p>Se califica la fuerza <b>total</b> de la sección, no la de cada nota: si la fragancia tiene una nota frutal fuerte y una de chocolate sutil, no se puntúan por separado — se marca qué tan fuerte es la fragancia completa.</p><p>0–5 baja · 5–10 media · 10–15 alta. Se registra el entero más cercano. <b>Intensidad no es calidad ni deseabilidad.</b></p>"],
    en:["Intensity from 0 to 15","<p>You rate the <b>total</b> strength of the section, not of each note: if the fragrance has a strong fruity note and a subtle chocolate one, they are not scored separately — you mark how strong the whole fragrance is.</p><p>0–5 low · 5–10 medium · 10–15 high. The nearest whole number is recorded. <b>Intensity is not quality or desirability.</b></p>"],
    de:["Intensität von 0 bis 15","<p>Bewertet wird die <b>gesamte</b> Stärke des Abschnitts, nicht die jeder Note: Hat die Fragrance eine starke fruchtige und eine feine schokoladige Note, werden sie nicht einzeln bewertet – Sie markieren, wie stark die Fragrance insgesamt ist.</p><p>0–5 niedrig · 5–10 mittel · 10–15 hoch. Notiert wird die nächstgelegene ganze Zahl. <b>Intensität ist weder Qualität noch Erwünschtheit.</b></p>"] },
  cva_cata:{ std:"SCA 103-2024 · 6.3",
    es:["Casillas CATA","<p>CATA = <i>check-all-that-apply</i>: una lista de categorías donde se marcan las que mejor representan el café. Hay una lista para la <b>nariz</b> (fragancia y aroma juntas) y otra para la <b>boca</b> (sabor y sabor residual juntos): <b>hasta 5</b> en cada una.</p><p>Las casillas son los círculos interior y medio de la rueda de sabores. El descriptor preciso («arándano») se escribe en las notas; si lo tocas en la rueda, la herramienta marca la casilla («Bayas») y anota el descriptor.</p><p>Esta herramienta cuenta la casilla más específica: «Bayas» trae consigo «Afrutado» sin contarlo dos veces.</p>"],
    en:["CATA boxes","<p>CATA = check-all-that-apply: a list of categories where you tick those that best represent the coffee. There is one list for the <b>nose</b> (fragrance and aroma together) and another for the <b>mouth</b> (flavor and aftertaste together): <b>up to 5</b> in each.</p><p>The boxes are the inner and middle circles of the flavour wheel. The precise descriptor (“blueberry”) is written in the notes; if you tap it on the wheel, the tool ticks the box (“Berry”) and notes the descriptor.</p><p>This tool counts the most specific box: “Berry” brings “Fruity” with it without counting twice.</p>"],
    de:["CATA-Felder","<p>CATA = <i>check-all-that-apply</i>: eine Liste von Kategorien, in der Sie jene ankreuzen, die den Kaffee am besten beschreiben. Es gibt eine Liste für die <b>Nase</b> (Fragrance und Aroma zusammen) und eine für den <b>Mund</b> (Geschmack und Nachgeschmack zusammen): jeweils <b>bis zu 5</b>.</p><p>Die Felder entsprechen dem inneren und mittleren Kreis des Aromarads. Der genaue Deskriptor («Blaubeere») gehört in die Notizen; tippen Sie ihn im Rad an, kreuzt das Werkzeug das Feld («Beeren») an und notiert den Deskriptor.</p><p>Dieses Werkzeug zählt das spezifischste Feld: «Beeren» schließt «Fruchtig» ein, ohne doppelt zu zählen.</p>"] },
  cva_gustos:{ std:"SCA 103-2024 · 6.3.2",
    es:["Gustos predominantes","<p>Hasta <b>2</b> gustos básicos que sobresalgan entre el sabor y el sabor residual: salado, ácido, dulce, amargo, umami.</p><p>Todo café tiene amargo: márcalo solo si <b>destaca</b>, sobre todo frente a los otros cafés de la mesa.</p>"],
    en:["Main tastes","<p>Up to <b>2</b> basic tastes that stand out across flavor and aftertaste: salty, sour, sweet, bitter, umami.</p><p>All coffees have bitterness: tick it only if it <b>stands out</b>, especially against the other coffees on the table.</p>"],
    de:["Vorherrschende Grundgeschmäcker","<p>Bis zu <b>2</b> Grundgeschmäcker, die in Geschmack und Nachgeschmack hervortreten: salzig, sauer, süß, bitter, umami.</p><p>Jeder Kaffee ist bitter: Kreuzen Sie es nur an, wenn es <b>hervorsticht</b>, vor allem im Vergleich zu den anderen Kaffees am Tisch.</p>"] },
  cva_textura:{ std:"SCA 103-2024 · 5.3 · 6.3.3",
    es:["Textura en boca","<p>Hasta <b>2</b> opciones que describan la <b>calidad</b> de la sensación en boca. Su intensidad —el cuerpo o espesor— ya está en la escala de 0 a 15.</p><p><b>Áspero:</b> partículas finas, como un café turco. <b>Aceitoso:</b> como café con un poco de mantequilla. <b>Suave:</b> como un almíbar. <b>Deja seca la boca:</b> astringencia. <b>Metálico:</b> recuerda a una lata o al papel aluminio.</p>"],
    en:["Mouthfeel texture","<p>Up to <b>2</b> options describing the <b>quality</b> of the mouthfeel. Its intensity — body or thickness — is already on the 0 to 15 scale.</p><p><b>Rough:</b> fine particles, as in ibrik coffee. <b>Oily:</b> like coffee with a little butter. <b>Smooth:</b> like a syrup. <b>Mouth-drying:</b> astringency. <b>Metallic:</b> reminiscent of tin cans or aluminium foil.</p>"],
    de:["Textur im Mund","<p>Bis zu <b>2</b> Optionen, die die <b>Qualität</b> des Mundgefühls beschreiben. Seine Intensität – Körper oder Dicke – steht bereits auf der Skala von 0 bis 15.</p><p><b>Rau:</b> feine Partikel, wie bei Mokka aus dem Ibrik. <b>Ölig:</b> wie Kaffee mit etwas Butter. <b>Weich:</b> wie ein Sirup. <b>Mundtrocknend:</b> Adstringenz. <b>Metallisch:</b> erinnert an Blechdosen oder Alufolie.</p>"] },
  cva_aff:{ std:"SCA 104-2024 · 5.2",
    es:["Impresión de calidad de 1 a 9","<p>La escala tiene un <b>punto medio verdadero</b>: 5 = ni alta ni baja. Por debajo, la impresión es cada vez más baja (1 = extremadamente baja); por encima, cada vez más alta (9 = extremadamente alta).</p><p>Refleja tu preferencia o la de un mercado que conoces bien — por eso importa el objetivo de la sesión. Úsala de forma intuitiva y sin dejarte influir por otros catadores. Admite cuartos de punto (7,25 · 7,5 · 7,75).</p>"],
    en:["Impression of quality from 1 to 9","<p>The scale has a <b>true midpoint</b>: 5 = neither high nor low. Below it, the impression gets lower (1 = extremely low); above it, higher (9 = extremely high).</p><p>It reflects your own preference or that of a market you know well — which is why the session's purpose matters. Use it intuitively and without being influenced by other cuppers. Quarter points are allowed (7.25 · 7.5 · 7.75).</p>"],
    de:["Qualitätseindruck von 1 bis 9","<p>Die Skala hat einen <b>echten Mittelpunkt</b>: 5 = weder hoch noch niedrig. Darunter wird der Eindruck immer niedriger (1 = extrem niedrig), darüber immer höher (9 = extrem hoch).</p><p>Sie spiegelt Ihre eigene Vorliebe oder die eines Marktes, den Sie gut kennen – deshalb ist der Zweck der Sitzung wichtig. Nutzen Sie sie intuitiv und ohne sich von anderen Verkostern beeinflussen zu lassen. Viertelpunkte sind zulässig (7,25 · 7,5 · 7,75).</p>"] },
  cva_notasA:{ std:"SCA 104-2024 · 5.3",
    es:["Notas afectivas","<p>No repiten la descripción: <b>justifican</b> la calificación. Explican por qué esa impresión de calidad — un juicio subjetivo— resulta de lo que percibiste.</p>"],
    en:["Affective notes","<p>They do not repeat the description: they <b>justify</b> the rating. They explain why that impression of quality — a subjective judgement — follows from what you perceived.</p>"],
    de:["Affektive Notizen","<p>Sie wiederholen nicht die Beschreibung, sondern <b>begründen</b> die Bewertung. Sie erklären, warum sich dieser Qualitätseindruck – ein subjektives Urteil – aus dem Wahrgenommenen ergibt.</p>"] },
  cva_tazas:{ std:"SCA 104-2024 · 5.4",
    es:["Uniformidad y defectos","<p><b>No uniforme:</b> una taza con una característica <b>cualitativamente</b> distinta de las demás. Que una taza sea solo más o menos intensa no cuenta: suele ser un error de preparación.</p><p><b>Defectuosa:</b> el formato solo admite tres defectos sensoriales —<b>mohoso, fenólico, papa</b>— y hay que decir cuál. Sin tipo, la taza no cuenta como defectuosa.</p><p>Toda taza defectuosa se marca también como no uniforme, salvo que las cinco tengan el mismo defecto. Resta <b>2 puntos</b> cada taza no uniforme y <b>4 puntos</b> cada taza defectuosa.</p>"],
    en:["Uniformity and defects","<p><b>Non-uniform:</b> a cup with a characteristic that is <b>qualitatively</b> different from the rest. A cup that is merely more or less intense does not count: that is usually a brewing error.</p><p><b>Defective:</b> the form allows only three sensory defects — <b>moldy, phenolic, potato</b> — and you must say which. Without a type, the cup does not count as defective.</p><p>Every defective cup is also marked non-uniform, except when all five share the same defect. Each non-uniform cup deducts <b>2 points</b> and each defective cup <b>4 points</b>.</p>"],
    de:["Gleichmäßigkeit und Fehler","<p><b>Ungleichmäßig:</b> eine Tasse mit einer Eigenschaft, die sich <b>qualitativ</b> von den anderen unterscheidet. Ist eine Tasse nur stärker oder schwächer, zählt das nicht: Das ist meist ein Zubereitungsfehler.</p><p><b>Fehlerhaft:</b> Das Formular kennt nur drei sensorische Fehler – <b>schimmelig, phenolisch, Kartoffel</b> – und Sie müssen angeben, welcher. Ohne Typ zählt die Tasse nicht als fehlerhaft.</p><p>Jede fehlerhafte Tasse wird auch als ungleichmäßig markiert, außer alle fünf haben denselben Fehler. Jede ungleichmäßige Tasse kostet <b>2 Punkte</b>, jede fehlerhafte <b>4 Punkte</b>.</p>"] },
  cva_punt:{ std:"SCA 104-2024 · 5.5",
    es:["El puntaje afectivo CVA","<p><b>S = 0,65625 × (suma de las ocho secciones) + 52,75 − 2 × (tazas no uniformes) − 4 × (tazas defectuosas)</b>, redondeado al 0,25 más cercano.</p><p>Puntos de referencia: ocho 5 (neutral) = 79; ocho 9 = 100; ocho 1 = 58.</p><p>Las intensidades y las casillas CATA <b>nunca</b> entran en la fórmula: describen, no califican. Y este número no se compara con el del formulario 2004.</p>"],
    en:["The CVA affective score","<p><b>S = 0.65625 × (sum of the eight sections) + 52.75 − 2 × (non-uniform cups) − 4 × (defective cups)</b>, rounded to the nearest 0.25.</p><p>Reference points: eight 5s (neutral) = 79; eight 9s = 100; eight 1s = 58.</p><p>Intensities and CATA boxes <b>never</b> enter the formula: they describe, they do not judge. And this number is not to be compared with the 2004 form's.</p>"],
    de:["Die affektive CVA-Punktzahl","<p><b>S = 0,65625 × (Summe der acht Abschnitte) + 52,75 − 2 × (ungleichmäßige Tassen) − 4 × (fehlerhafte Tassen)</b>, gerundet auf die nächsten 0,25.</p><p>Bezugspunkte: achtmal 5 (neutral) = 79; achtmal 9 = 100; achtmal 1 = 58.</p><p>Intensitäten und CATA-Felder gehen <b>nie</b> in die Formel ein: Sie beschreiben, sie urteilen nicht. Und diese Zahl ist nicht mit der des Formulars von 2004 vergleichbar.</p>"] },
  sec_fragrance:{ std:"SCA 102-2024 · 4.4",
    es:["Fragancia","<p>El olor del café molido <b>en seco</b>, antes del agua. Es puramente olfativa (por la nariz, ortonasal).</p>"],
    en:["Fragrance","<p>The smell of the <b>dry</b> coffee grounds, before water. Purely olfactory (through the nose, orthonasal).</p>"],
    de:["Fragrance","<p>Der Geruch des <b>trockenen</b> Mahlguts, vor dem Wasser. Rein olfaktorisch (durch die Nase, orthonasal).</p>"] },
  sec_aroma:{ std:"SCA 102-2024 · 4.4",
    es:["Aroma","<p>El olor de la <b>bebida</b>, evaluado en dos momentos: recién servida el agua, con la costra intacta, y al romper la costra.</p>"],
    en:["Aroma","<p>The smell of the <b>brew</b>, assessed at two moments: right after pouring, with the crust intact, and as the crust is broken.</p>"],
    de:["Aroma","<p>Der Geruch des <b>Aufgusses</b>, zu zwei Zeitpunkten beurteilt: direkt nach dem Aufgießen bei intakter Kruste und beim Brechen der Kruste.</p>"] },
  sec_flavor:{ std:"SCA 102-2024 · 4.4",
    es:["Sabor","<p>La percepción combinada del gusto y del olor retronasal mientras el café está en la boca. El cerebro la funde en una sola impresión.</p>"],
    en:["Flavor","<p>The combined perception of taste and retronasal smell while the coffee is in the mouth. The brain merges them into a single impression.</p>"],
    de:["Geschmack","<p>Die kombinierte Wahrnehmung von Geschmack und retronasalem Geruch, während der Kaffee im Mund ist. Das Gehirn verschmilzt sie zu einem Eindruck.</p>"] },
  sec_aftertaste:{ std:"SCA 102-2024 · 4.4",
    es:["Sabor residual","<p>Lo que dejan los restos de la bebida en boca y garganta después de expulsarla o tragarla: gusto, olor retronasal y duración.</p>"],
    en:["Aftertaste","<p>What the remnants of the brew leave in the mouth and throat after it is ejected or swallowed: taste, retronasal smell and length.</p>"],
    de:["Nachgeschmack","<p>Was die Reste des Aufgusses in Mund und Rachen hinterlassen, nachdem er ausgespuckt oder geschluckt wurde: Geschmack, retronasaler Geruch und Dauer.</p>"] },
  sec_acidity:{ std:"SCA 102-2024 · 4.4",
    es:["Acidez","<p>La percepción del gusto ácido que provoca la bebida, que varía en intensidad y en carácter. No tiene lista CATA: su carácter se describe con palabras propias en las notas (cítrica, málica, vinosa…).</p>"],
    en:["Acidity","<p>The perception of sour taste provoked by the brew, which varies in intensity and character. It has no CATA list: describe its character in your own words in the notes (citric, malic, winey…).</p>"],
    de:["Säure","<p>Die Wahrnehmung des sauren Geschmacks, den der Aufguss auslöst und der in Intensität und Charakter variiert. Sie hat keine CATA-Liste: Beschreiben Sie ihren Charakter mit eigenen Worten in den Notizen (zitrisch, apfelig, weinig …).</p>"] },
  sec_sweetness:{ std:"SCA 102-2024 · 4.4",
    es:["Dulzor","<p>La percepción de dulzor, por el gusto o por vía retronasal. Tampoco tiene lista CATA: descríbelo en las notas (panela, miel, fruta madura…).</p>"],
    en:["Sweetness","<p>The perception of sweetness, gustatory or retronasal. It has no CATA list either: describe it in the notes (panela, honey, ripe fruit…).</p>"],
    de:["Süße","<p>Die Wahrnehmung von Süße, über den Geschmack oder retronasal. Auch sie hat keine CATA-Liste: Beschreiben Sie sie in den Notizen (Panela, Honig, reife Frucht …).</p>"] },
  sec_mouthfeel:{ std:"SCA 102-2024 · 4.4",
    es:["Sensación en boca","<p>La percepción táctil de la bebida, sin contar la temperatura: su espesor (viscosidad), su textura y otras sensaciones como la astringencia.</p>"],
    en:["Mouthfeel","<p>The tactile perception of the brew, excluding temperature: its thickness (viscosity), its texture and other sensations such as astringency.</p>"],
    de:["Mundgefühl","<p>Die taktile Wahrnehmung des Aufgusses, ohne die Temperatur: seine Dicke (Viskosität), seine Textur und weitere Empfindungen wie Adstringenz.</p>"] },
  sec_overall:{ std:"SCA 104-2024 · 4.3",
    es:["Impresión global","<p>La impresión general de calidad del café, incluido lo que no cubren las otras secciones: el balance y tu preferencia personal. Se califica al final. <b>Solo existe en la parte afectiva</b> y cuenta una vez, como las demás.</p>"],
    en:["Overall","<p>The general impression of quality of the coffee, including what the other sections do not cover: balance and your personal preference. It is rated at the end. It <b>exists only in the affective part</b> and counts once, like the rest.</p>"],
    de:["Gesamteindruck","<p>Der allgemeine Qualitätseindruck des Kaffees, einschließlich dessen, was die anderen Abschnitte nicht abdecken: Balance und persönliche Vorliebe. Er wird am Ende bewertet. Ihn <b>gibt es nur im affektiven Teil</b>, und er zählt einmal wie die anderen.</p>"] },

  /* ── físico ── */
  f_muestra:{ std:"Formato físico CVA · SCA café verde",
    es:["La muestra de café verde","<p>El conteo de defectos se hace sobre <b>350 g</b> de café verde. Si tu muestra pesa otra cosa, escríbelo: los porcentajes de mallas se calculan contra ese peso.</p><p>Referencias habituales del estándar SCA de café verde: <b>humedad de 10 a 12 %</b> y <b>actividad de agua menor de 0,70</b>. La densidad no es un campo del formato: es un dato que CTCx pide en sus fichas (por encima de 700 g/L suele indicar un grano denso, de altura).</p>"],
    en:["The green coffee sample","<p>Defects are counted on <b>350 g</b> of green coffee. If your sample weighs something else, enter it: screen percentages are calculated against that weight.</p><p>Usual references from the SCA green coffee standard: <b>moisture from 10 to 12 %</b> and <b>water activity below 0.70</b>. Density is not a field on the form: it is something CTCx asks for on its datasheets (above 700 g/L usually points to a dense, high-grown bean).</p>"],
    de:["Die Rohkaffeeprobe","<p>Defekte werden an <b>350 g</b> Rohkaffee gezählt. Wiegt Ihre Probe anders, tragen Sie es ein: Die Siebanteile werden gegen dieses Gewicht berechnet.</p><p>Übliche Richtwerte des SCA-Rohkaffeestandards: <b>Feuchte 10 bis 12 %</b> und <b>Wasseraktivität unter 0,70</b>. Die Dichte ist kein Feld des Formulars: CTCx verlangt sie in seinen Datenblättern (über 700 g/L deutet meist auf eine dichte Hochlandbohne hin).</p>"] },
  f_color:{ std:"Formato físico CVA",
    es:["Color","<p>El color del grano verde, en las ocho opciones del formato: de verde-azul (fresco, bien secado) a parduzco (envejecido o mal almacenado). Se mira con luz de día o luz blanca.</p>"],
    en:["Colour","<p>The colour of the green bean, in the form's eight options: from blue-green (fresh, well dried) to brownish (aged or poorly stored). Judge it under daylight or white light.</p>"],
    de:["Farbe","<p>Die Farbe der rohen Bohne in den acht Optionen des Formulars: von Blaugrün (frisch, gut getrocknet) bis Bräunlich (gealtert oder schlecht gelagert). Bei Tageslicht oder weißem Licht beurteilen.</p>"] },
  f_def:{ std:"Formato físico CVA · SCA café verde",
    es:["Defectos y equivalencias","<p>Se cuentan los granos de cada tipo y se convierten en <b>defectos completos</b> con la equivalencia del formato: «5:1» quiere decir que cinco granos hacen un defecto completo; «1:1», que cada grano es un defecto.</p><p>La herramienta cuenta solo los defectos enteros: 7 granos partidos (5:1) son 1 defecto completo.</p><p><b>Categoría 1</b> (primarios): los que más dañan la taza. <b>Categoría 2</b> (secundarios): menos graves, pero afectan la consistencia.</p>"],
    en:["Defects and equivalences","<p>You count the beans of each type and convert them into <b>full defects</b> using the form's equivalence: “5:1” means five beans make one full defect; “1:1”, each bean is one defect.</p><p>The tool counts whole defects only: 7 broken beans (5:1) are 1 full defect.</p><p><b>Category 1</b> (primary): those that harm the cup most. <b>Category 2</b> (secondary): less serious, but they affect consistency.</p>"],
    de:["Defekte und Äquivalenzen","<p>Sie zählen die Bohnen jedes Typs und rechnen sie mit der Äquivalenz des Formulars in <b>volle Defekte</b> um: «5:1» heißt, fünf Bohnen ergeben einen vollen Defekt; «1:1», jede Bohne ist ein Defekt.</p><p>Das Werkzeug zählt nur ganze Defekte: 7 gebrochene Bohnen (5:1) sind 1 voller Defekt.</p><p><b>Kategorie 1</b> (primär): schaden der Tasse am meisten. <b>Kategorie 2</b> (sekundär): weniger schwer, beeinträchtigen aber die Konsistenz.</p>"] },
  f_cls:{ std:"Clasificación SCA de café verde arábica",
    es:["Clasificación de café verde","<p>Referencia clásica de la SCA sobre 350 g: <b>especialidad</b> = ningún defecto de categoría 1 y hasta 5 defectos completos, sin quakers; <b>premium</b> = hasta 8 defectos completos, hasta 3 quakers; <b>exchange</b> = de 9 a 23; <b>por debajo del estándar</b> = de 24 a 86; <b>fuera de grado</b> = más de 86.</p><p>Los quakers son granos que no tuestan (quedan pálidos); se cuentan en 100 g de café tostado.</p><p>Es una referencia: lo que manda es la especificación de tu contrato.</p>"],
    en:["Green coffee classification","<p>The classic SCA reference on 350 g: <b>specialty</b> = no category 1 defects and up to 5 full defects, no quakers; <b>premium</b> = up to 8 full defects, up to 3 quakers; <b>exchange</b> = 9 to 23; <b>below standard</b> = 24 to 86; <b>off grade</b> = more than 86.</p><p>Quakers are beans that do not roast (they stay pale); they are counted in 100 g of roasted coffee.</p><p>It is a reference: what governs is your contract's specification.</p>"],
    de:["Rohkaffeeklassifizierung","<p>Die klassische SCA-Referenz auf 350 g: <b>Specialty</b> = keine Defekte der Kategorie 1 und bis zu 5 volle Defekte, keine Quaker; <b>Premium</b> = bis zu 8 volle Defekte, bis zu 3 Quaker; <b>Exchange</b> = 9 bis 23; <b>unter Standard</b> = 24 bis 86; <b>Off Grade</b> = mehr als 86.</p><p>Quaker sind Bohnen, die nicht rösten (sie bleiben blass); gezählt wird in 100 g Röstkaffee.</p><p>Es ist eine Referenz: Maßgeblich ist die Spezifikation Ihres Vertrags.</p>"] },
  f_mallas:{ std:"Formato físico CVA · práctica colombiana",
    es:["Tamaño por mallas","<p>La granulometría reparte la muestra por tamaño: el número de la malla es el diámetro del orificio en 1/64 de pulgada (malla 17 ≈ 6,75 mm). Se pesa lo que <b>retiene</b> cada malla.</p><p>Con <b>CVA</b> se llena el formato oficial, de la malla 10 a la 23. Con <b>SCA 2004</b> se usan las agrupaciones comerciales de Colombia: Supremo (17 y más), Extra (16), Europa (15), UGQ (14).</p><p>La suma debe acercarse al peso de la muestra; la diferencia es lo que no retuvo ninguna malla.</p>"],
    en:["Size by screens","<p>Screening splits the sample by size: the screen number is the hole diameter in 1/64 of an inch (screen 17 ≈ 6.75 mm). You weigh what each screen <b>retains</b>.</p><p>With <b>CVA</b> you fill in the official form, screens 10 to 23. With <b>SCA 2004</b> the Colombian commercial groupings are used: Supremo (17 and up), Extra (16), Europa (15), UGQ (14).</p><p>The sum should approach the sample weight; the difference is what no screen retained.</p>"],
    de:["Größe nach Sieben","<p>Die Siebung teilt die Probe nach Größe: Die Siebnummer ist der Lochdurchmesser in 1/64 Zoll (Sieb 17 ≈ 6,75 mm). Gewogen wird, was jedes Sieb <b>zurückhält</b>.</p><p>Bei <b>CVA</b> füllen Sie das offizielle Formular aus, Siebe 10 bis 23. Bei <b>SCA 2004</b> gelten die kolumbianischen Handelsgruppen: Supremo (17 und größer), Extra (16), Europa (15), UGQ (14).</p><p>Die Summe sollte nahe am Probengewicht liegen; die Differenz ist das, was kein Sieb zurückgehalten hat.</p>"] },
  f_factor:{ std:"Práctica colombiana (FNC) · CTCx",
    es:["Factor de rendimiento","<p>No es del SCA ni del CVA: es la medida con la que se compra café pergamino en Colombia.</p><p><b>Factor = 70 × muestra de pergamino ÷ grano sano</b>, donde grano sano = verde tras la trilla − defectos. Con la muestra estándar de 250 g, un factor de 92 quiere decir que hacen falta 92 kg de pergamino para sacar 70 kg de café verde exportable. Cuanto más bajo, mejor rinde.</p>"],
    en:["Yield factor","<p>This is neither SCA nor CVA: it is the measure used to buy parchment coffee in Colombia.</p><p><b>Factor = 70 × parchment sample ÷ sound beans</b>, where sound beans = green after hulling − defects. With the standard 250 g sample, a factor of 92 means it takes 92 kg of parchment to obtain 70 kg of exportable green coffee. The lower, the better the yield.</p>"],
    de:["Ausbeutefaktor","<p>Weder SCA noch CVA: Es ist das Maß, mit dem in Kolumbien Pergamino-Kaffee gekauft wird.</p><p><b>Faktor = 70 × Pergamino-Probe ÷ gesunde Bohnen</b>, wobei gesunde Bohnen = Rohkaffee nach dem Schälen − Defekte. Bei der Standardprobe von 250 g bedeutet ein Faktor von 92, dass 92 kg Pergamino für 70 kg exportfähigen Rohkaffee nötig sind. Je niedriger, desto besser die Ausbeute.</p>"] },

  /* ── extrínseca ── */
  e_que:{ std:"SCA 105-2025",
    es:["La evaluación extrínseca","<p>Los atributos extrínsecos son la información y los símbolos que acompañan al café por la cadena: de dónde viene, quién lo produjo, cómo se procesó, qué certificaciones tiene. También generan valor.</p><p>El evaluador <b>documenta</b>, no califica: responde «¿qué sé de este café, más allá de la taza y del grano?». El formato trae casillas para los atributos más reconocidos y espacio libre para todo lo demás; que algo no tenga casilla no lo hace menos importante. Casi ningún café llena todas.</p>"],
    en:["The extrinsic assessment","<p>Extrinsic attributes are the information and symbols that travel with the coffee along the chain: where it comes from, who produced it, how it was processed, which certifications it holds. They generate value too.</p><p>The assessor <b>documents</b>; they do not rate: they answer “what do I know about this coffee, beyond the cup and the bean?”. The form has boxes for the most widely recognised attributes and free space for everything else; something not having a box does not make it less important. Hardly any coffee fills them all.</p>"],
    de:["Die extrinsische Bewertung","<p>Extrinsische Attribute sind die Informationen und Symbole, die den Kaffee durch die Kette begleiten: woher er kommt, wer ihn erzeugt hat, wie er aufbereitet wurde, welche Zertifizierungen er trägt. Auch sie schaffen Wert.</p><p>Der Bewerter <b>dokumentiert</b>, er bewertet nicht: Er beantwortet «Was weiß ich über diesen Kaffee, jenseits von Tasse und Bohne?». Das Formular hat Kästchen für die bekanntesten Attribute und freien Raum für alles andere; dass etwas kein Kästchen hat, macht es nicht weniger wichtig. Kaum ein Kaffee füllt alle aus.</p>"] },

    en:["Farming","<p>Boxes on the form: country, region (state, municipality, village), farm or co-op, producer(s), species, variety(ies), harvest date or year, and “other”.</p><p>As relevant information you can add altitude, latitude and longitude, shade, pruning, fertilising and harvesting approach. In this tool, altitude, georeference and municipality light up the “other” box.</p>"],

  e_proceso:{ std:"SCA 105-2025 · 5.4",

    de:["Aufbereitung","<p>Kästchen: Name der Verarbeiter (Nassaufbereitung, Trockenmühle, andere), Aufbereitungsart (gewaschen, natural, andere), entkoffeiniert und Beschreibung der Aufbereitung.</p><p>Ein Honey ist weder gewaschen noch natural: «Andere» ankreuzen und «Honey» schreiben. Bezugspunkt des Standards ist die letzte Schicht auf dem Samen am Ende der Trocknung: Frucht (natural), Schleim (Honey), Pergamenthaut (gewaschen), Samen (wet-hulled).</p><p>Ein kurzer Satz gilt bereits als Beschreibung, doch Details – Gärzeit und -temperatur, Starterkulturen, etwaige Aromazusätze – sind meist wertvoll.</p>"] },

    de:["Handel","<p>Kästchen: Handelsklasse (Supremo, Excelso EP, SHB …), ICO-Nummer, Importeur, Exporteur, Erzeugerpreis, Partiegröße und «Sonstiges».</p><p>Als relevante Angaben: Handelsmodell (Direkthandel, Spot), FOB-Preis, Prämie, Rückverfolgbarkeit, Zahlungsbedingungen, Dauer der Beziehung zwischen Käufer und Verkäufer. Lieferant, Steuernummer, CTCx-Partiecode und HS-Code sind Felder des CTCx-Datenblatts und aktivieren «Sonstiges».</p>"] },

    en:["Certifications","<p>Boxes on the form: 4C, fair trade, organic, Rainforest Alliance, food safety and “other”.</p><p>As free descriptors you can add other third-party schemes (Bird Friendly, Regenerative Organic), company verification schemes (Nespresso AAA, C.A.F.E. Practices) and geographical indications (Café de Colombia). The EUDR is not a certification but a legal requirement of the European Union; it is noted here because European buyers ask for it.</p><p>Add certificate number, validity dates and verification link.</p>"],
    de:["Zertifizierungen","<p>Kästchen des Formulars: 4C, fairer Handel, Bio, Rainforest Alliance, Lebensmittelsicherheit und «andere».</p><p>Als freie Deskriptoren passen weitere Drittzertifizierungen (Bird Friendly, Regenerative Organic), unternehmenseigene Verifizierungen (Nespresso AAA, C.A.F.E. Practices) und geografische Angaben (Café de Colombia). Die EUDR ist keine Zertifizierung, sondern eine gesetzliche Anforderung der Europäischen Union; sie steht hier, weil europäische Käufer sie verlangen.</p><p>Ergänzen Sie Zertifikatsnummer, Gültigkeit und Verifizierungslink.</p>"] },

/* ═══════════════════════════════════════════════════════════════════════════
   3. EL NÚCLEO — aritmética pura, sin DOM. El guardián la ejecuta en Node y la
   compara con la de la plataforma (`src/lib/arena/labEvaluation.ts`): las dos
   fórmulas —SCA 2004 y CVA— tienen que dar lo mismo aquí y en la planilla del
   Centro de Calidad. Los nombres de campo (`sca_*`, `cva_*`, `cva_tazas`,
   `mesh_*`, `fa_*`) son los de la planilla a propósito.
   ═══════════════════════════════════════════════════════════════════════════ */
/*<NUCLEO-PURO>*/
const CVA_SEC = ["fragrance","aroma","flavor","aftertaste","acidity","sweetness","mouthfeel","overall"];
const CVA_K = { coef:0.65625, base:52.75, nu:2, def:4, min:1, max:9, tazas:5, paso:0.25 };
const SCA_ATR = ["fragrance","flavor","aftertaste","acidity","body","balance","uniformity","clean_cup","sweetness","cuppers"];
const SCA_TAZ = ["uniformity","clean_cup","sweetness"];
const SCA_K = { min:6, max:10, paso:0.25, porTaza:2, tazas:5, taint:2, fault:4 };
// [clave, categoría, granos por defecto completo] — formato de Evaluación Física del CVA (alfa V1, mayo de 2025).
const DEFECTOS = [
  ["negro",1,1],["agrio",1,1],["cereza",1,1],["hongos",1,1],["extrana",1,1],["insecto_grave",1,5],
  ["negro_parcial",2,3],["agrio_parcial",2,3],["pergamino",2,5],["flotador",2,5],["inmaduro",2,5],
  ["averanado",2,5],["concha",2,5],["partido",2,5],["cascarilla",2,5],["insecto_leve",2,10]
];
const MALLAS_CVA = [23,22,21,20,19,18,17,16,15,14,13,12,11,10];
const MALLAS_CO = ["mesh_supremo_plus","mesh_supremo","mesh_extra","mesh_europa","mesh_ugq","mesh_peaberry"];
// Las 24 casillas CATA del formato descriptivo: [id, padre]. El padre con una hija marcada no cuenta aparte.
const CATA = [
  ["floral",null],["fruity",null],["berry","fruity"],["dried","fruity"],["citrus","fruity"],
  ["sourferm",null],["sour","sourferm"],["fermented","sourferm"],["green",null],
  ["other",null],["chemical","other"],["musty","other"],["woody","other"],
  ["roasted",null],["cereal","roasted"],["burnt","roasted"],["tobacco","roasted"],
  ["nuttycocoa",null],["nutty","nuttycocoa"],["cocoa","nuttycocoa"],["spice",null],
  ["sweet",null],["vanilla","sweet"],["brownsugar","sweet"]
];
const TOPE = { cata:5, gustos:2, textura:2 };

function numO(v){ const s = String(v==null?"":v).trim(); if(!s) return null; const n = Number(s.replace(",",".")); return Number.isFinite(n) ? n : null; }
function num0(v){ const n = parseFloat(String(v==null?"":v).replace(",",".")); return isNaN(n) ? 0 : n; }
function r2(n){ return Math.round(n*100)/100; }
function alCuarto(x){ return r2(Math.round(x/0.25)*0.25); }

function contarTazas(tazas){
  const tz = (Array.isArray(tazas)?tazas:[]).slice(0, CVA_K.tazas);
  const d = tz.filter(function(x){ return x && x.defectuosa; }).length;
  const u = d === CVA_K.tazas ? 0 : tz.filter(function(x){ return x && (x.noUniforme || x.defectuosa); }).length;
  const sinTipo = tz.some(function(x){ return x && x.defectuosa && !x.defecto; });
  return { u:u, d:d, sinTipo:sinTipo };
}

/** CVA afectiva (SCA-104 · 5.5): S = 0,65625 × Σ + 52,75 − 2u − 4d, al 0,25. Incompleta → sin puntaje. */
function calcCva(ev){
  let suma = 0, cal = 0; const faltan = [], errores = [];
  CVA_SEC.forEach(function(k){
    const raw = String(ev["cva_"+k]==null?"":ev["cva_"+k]).trim();
    if(!raw){ faltan.push(k); return; }
    const n = numO(raw);
    if(n==null || n<CVA_K.min || n>CVA_K.max || Math.abs(n/CVA_K.paso - Math.round(n/CVA_K.paso))>1e-9){ errores.push("rango:"+k); return; } /* V5.135: cuartos de punto, como la planilla */
    cal++; suma += n;
  });
  const tz = contarTazas(ev.cva_tazas);
  if(tz.sinTipo) errores.push("sinTipo");
  if(cal>0 && faltan.length) errores.push("incompleta");
  const completa = cal === CVA_SEC.length && errores.length === 0;
  const total = completa ? Math.max(0, alCuarto(CVA_K.coef*suma + CVA_K.base - CVA_K.nu*tz.u - CVA_K.def*tz.d)) : null;
  return { suma:suma, calificadas:cal, completa:completa, faltan:faltan, errores:errores, u:tz.u, d:tz.d, sinTipo:tz.sinTipo, total:total };
}

/** SCA 2004: siete atributos 6,00–10,00 al 0,25, tres por taza (2 puntos cada una), menos taint×2 y fault×4. Diez completos o no hay puntaje. */
/** V5.147 · cuántas tazas usó el catador: un entero de 1 a 10; cualquier otra cosa, las 5 del protocolo (como la planilla). */
function tazasUsadas(v){ const n = Number(String(v==null?"":v).replace(",",".")); return Number.isInteger(n) && n>=1 && n<=10 ? n : SCA_K.tazas; }
function calcSca2004(ev){
  const faltan = [], errores = []; let cal = 0, suma = 0;
  SCA_ATR.forEach(function(k){
    const raw = String(ev["sca_"+k]==null?"":ev["sca_"+k]).trim();
    if(!raw){ faltan.push(k); return; }
    const n = numO(raw);
    if(n==null){ errores.push("numero:"+k); return; }
    if(SCA_TAZ.indexOf(k)>=0){
      if(n<0 || n>SCA_K.max || Math.abs(n/SCA_K.paso - Math.round(n/SCA_K.paso))>1e-9){ errores.push("taza:"+k); return; } /* V5.135: 0–10 al 0,25, como la planilla */
    } else if(n<SCA_K.min || n>SCA_K.max || Math.abs(n/SCA_K.paso - Math.round(n/SCA_K.paso))>1e-9){ errores.push("escala:"+k); return; }
    cal++;
  });
  SCA_ATR.forEach(function(k){ suma += Math.min(10, Math.max(0, num0(ev["sca_"+k]))); });
  suma = r2(suma);
  const tope = tazasUsadas(ev.sca_num_tazas); /* V5.147: el tope es el número de tazas usadas */
  function tazasDe(v, nombre){ const n = numO(v); const x = n==null ? 0 : n; if(!Number.isInteger(x) || x<0 || x>tope){ errores.push("tazas:"+nombre); return 0; } return x; }
  const taint = tazasDe(ev.sca_taint_cups,"taint"), fault = tazasDe(ev.sca_fault_cups,"fault");
  if(cal>0 && faltan.length) errores.push("incompleta");
  const completa = cal === SCA_ATR.length && errores.length === 0;
  const defectos = SCA_K.taint*taint + SCA_K.fault*fault;
  return { total: completa ? r2(suma - defectos) : null, completa:completa, calificados:cal, faltan:faltan, errores:errores, taint:taint, fault:fault, defectos:defectos, suma:suma };
}
function claseSca(total){ if(total==null) return ""; return total>=90 ? "cls90" : total>=85 ? "cls85" : total>=80 ? "cls80" : "cls0"; }
function palabraSca(v){ const n = numO(v); if(n==null) return ""; return n>=9 ? "q9" : n>=8 ? "q8" : n>=7 ? "q7" : "q6"; }

/** Defectos físicos: granos → defectos completos (solo enteros), por categoría. */
function calcDefectos(cuentas){
  const c = cuentas || {}; const filas = {}; let c1 = 0, c2 = 0, granos = 0;
  DEFECTOS.forEach(function(d){
    const n = Math.max(0, Math.floor(num0(c[d[0]])));
    const comp = Math.floor(n / d[2]);
    filas[d[0]] = { granos:n, completos:comp };
    granos += n; if(d[1]===1) c1 += comp; else c2 += comp;
  });
  return { filas:filas, cat1:c1, cat2:c2, total:c1+c2, granos:granos };
}
/** Referencia clásica SCA de café verde sobre 350 g. `quakers` puede venir vacío. */
function clasificaVerde(def, quakers){
  if(!def.granos && numO(quakers)==null) return "";
  const q = numO(quakers);
  if(def.cat1===0 && def.total<=5 && (q==null || q===0)) return "spec";
  if(def.total<=8 && (q==null || q<=3)) return "prem";
  if(def.total<=23) return "exch";
  if(def.total<=86) return "below";
  return "off";
}
/** Mallas contra el peso de la muestra: porcentajes, lo no retenido y si la balanza cuadra. */
function calcMallas(gramos, base){
  const b = num0(base); let suma = 0;
  const filas = gramos.map(function(g){ const x = Math.max(0, num0(g)); suma += x; return { g:x, pct: b>0 ? x/b*100 : null }; });
  suma = r2(suma);
  const resto = b>0 ? r2(b - suma) : 0;
  const estado = b<=0 ? "sin_base" : suma<=0 ? "vacio" : suma>b+0.05 ? "excede" : (resto/b*100)>5 ? "falta" : "ok";
  return { filas:filas, suma:suma, resto:resto, restoPct: b>0 ? Math.max(0,resto)/b*100 : 0, estado:estado };
}
/** Factor de rendimiento (la misma aritmética de `computeFactor` de la Ficha de Kaffetal Regal). */
function calcFactor(f){
  const start = num0(f.fa_start), rem = num0(f.fa_green_remainder);
  const merma = Math.max(0, start - rem);
  const sano = rem>0 ? Math.max(0, rem - num0(f.fa_primary_defect) - num0(f.fa_secondary_defect)) : 0;
  return { start:start, rem:rem, merma:merma, sano:sano, factor: sano>0 ? (70*start)/sano : null };
}
/** Cuántas casillas CATA cuentan: la madre con una hija marcada va implícita. */
function cataCuenta(lista){
  const set = {}; (lista||[]).forEach(function(x){ set[x] = 1; });
  let n = 0;
  CATA.forEach(function(c){
    if(!set[c[0]]) return;
    if(c[1]===null && CATA.some(function(h){ return h[1]===c[0] && set[h[0]]; })) return;
    n++;
  });
  return n;
}

function radar(ejes, series){
  const N = ejes.length, R = 74;
  const pt = function(i, f){ const a = Math.PI*2*i/N - Math.PI/2; return [(R*f*Math.cos(a)).toFixed(1), (R*f*Math.sin(a)).toFixed(1)]; };
  let s = "<svg class=\"radar\" viewBox=\"-112 -96 224 192\" role=\"img\">";
  [0.25,0.5,0.75,1].forEach(function(f){ s += "<polygon class=\"rg\" points=\""+ejes.map(function(_,i){ return pt(i,f).join(","); }).join(" ")+"\"/>"; });
  ejes.forEach(function(e,i){ const p = pt(i,1), q = pt(i,1.2); s += "<line class=\"ra\" x1=\"0\" y1=\"0\" x2=\""+p[0]+"\" y2=\""+p[1]+"\"/><text class=\"rl\" x=\""+q[0]+"\" y=\""+q[1]+"\">"+esc(e)+"</text>"; });
  series.forEach(function(se){
    if(!se.v.some(function(f){ return f!=null; })) return;
    const ps = se.v.map(function(f,i){ return f==null ? null : pt(i, Math.max(0, Math.min(1,f))); });
    s += "<polygon class=\"rp "+se.cls+"\" points=\""+ps.filter(Boolean).map(function(p){ return p.join(","); }).join(" ")+"\"/>";
    se.v.forEach(function(f,i){ if(f!=null) s += "<circle class=\"rd "+se.cls+"\" cx=\""+ps[i][0]+"\" cy=\""+ps[i][1]+"\" r=\"2.4\"/>"; });
  });
  return s+"</svg>";
}

function oficiales(l){

  const o = {

    comercio_otro:v(e.proveedor)||v(e.nit)||v(e.uid)||v(e.hs)||v(e.comercio_info),

  if(UI.tab==="sabor"){
    D.puntaje = puntajeHTML();
    if(sca){
      const ev = evSca(l);
      SCA_ESC.forEach(function(k){ const n = numO(l["sca_"+k]); D["v.sca_"+k] = n==null ? "—" : nf(n); D["w.sca_"+k] = n==null ? t("sinCal") : t(palabraSca(n)); });
      SCA_TAZ.forEach(function(k){ const n = numO(ev["sca_"+k]); D["v.sca_"+k] = n==null ? "—" : nf(n); D["w.sca_"+k] = n==null ? t("sinCal") : ""; });
      const nT = numO(l.sca_taint_cups)||0, nF = numO(l.sca_fault_cups)||0, resta = SCA_K.taint*nT + SCA_K.fault*nF;
      D["v.sca_def"] = t("scaDefRes", nT, nF, resta ? "−"+resta : "0");
    } else {
      CVA_INT.forEach(function(k){ const n = numO(l.cva_int[k]); D["v.cva_int."+k] = n==null ? "—" : String(n); });
      CVA_SEC.forEach(function(k){ const n = numO(l["cva_"+k]); D["ad."+k] = n==null ? "" : Number.isInteger(n) && n>=1 && n<=9 ? n+" · "+esc(t("e"+n)) : nf(n); /* la palabra de la escala es de los enteros: un 7,5 no es «alta» ni «muy alta» */ });
    }
    Object.keys(l.rueda_detalle).forEach(function(c){ D["mi."+c] = esc(l.rueda_detalle[c].intensidad)+"/15"; });
  }
  if(UI.tab==="fisico"){
    const d = calcDefectos(l.fis_def), mm = mallasDe(l), m = mm.m, f = calcFactor(l);
    DEFECTOS.forEach(function(x){ D["dc."+x[0]] = d.filas[x[0]].granos ? String(d.filas[x[0]].completos) : "·"; });
    D.dt1 = String(d.cat1); D.dt2 = String(d.cat2); D.dtot = String(d.total);

    }
    mm.keys.forEach(function(k,i){ const r = m.filas[i]; D["mp."+k] = r.pct==null || !r.g ? "—" : nf(r.pct,1)+" %"; D["bar."+k] = r.pct==null ? 0 : Math.min(100, r.pct); });
    const hay = m.estado!=="sin_base" && m.estado!=="vacio";
    D.msum = nf(m.suma,1)+" g"; D.mresto = hay ? nf(Math.max(0,m.resto),1)+" g" : "—"; D.mrestoPct = hay ? nf(m.restoPct,1)+" %" : "";
    D.mestado = m.estado==="sin_base" ? "<div class=\"veredicto\">"+t("mSinBase")+"</div>" : m.estado==="excede" ? "<div class=\"veredicto mal\">"+t("mExcede", nf(-m.resto,1))+"</div>" :
      m.estado==="falta" ? "<div class=\"veredicto medio\">"+t("mFalta", nf(m.resto,1), nf(m.restoPct,1))+"</div>" : m.estado==="ok" ? "<div class=\"veredicto ok\">"+t("mOk")+"</div>" : "";
    if(!sca){
      const sobre = function(n){ let p = 0; MALLAS_CVA.forEach(function(x,i){ if(x>=n && m.filas[i].pct!=null) p += m.filas[i].pct; }); return nf(p,1); };
      D.macum = hay ? t("mAcum", sobre(17), sobre(15), sobre(14)) : "";
    }
    D.factor = f.factor!=null ? t("faRes", nf(f.factor), nf(f.sano,1), nf(f.merma,1)) : t("faVacio");
  }
  if(UI.tab==="basico"){ const f = calcFactor(l); D.factor = f.factor!=null ? t("faRes", nf(f.factor), nf(f.sano,1), nf(f.merma,1)) : t("faVacio"); }
  if(UI.tab==="extr" || UI.tab==="basico"){
    let tot = 0, hayP = false;
    if(UI.tab==="extr"){
      const of = oficiales(l);
      D.extCuenta = t("extCuenta", of.total);
      Object.keys(of.cuenta).forEach(function(g){ D["xc."+g] = of.cuenta[g][0]+" / "+of.cuenta[g][1]; });
    }
    l.ext.variedades.forEach(function(v,i){
      if(String(v.p).trim()!==""){ hayP = true; tot += num0(v.p); }
      const q = sinTildes(v.n.trim()), x = q ? VARIEDADES.filter(function(y){ return sinTildes(y.v)===q; })[0] : null;
      D["vm."+i] = x ? esc(x.e)+" · "+esc(x.l) : "";
    });
    D.varTot = hayP ? t("xVarTot", nf(tot,0)) : "";
  }
  return D;
}
function refrescar(){
  if(!S.metodo || UI.elegir) return;
  const D = derivados(), l = lote();
  $$("[data-o]").forEach(function(el){ const k = el.dataset.o; if(k in D && el.innerHTML!==D[k]) el.innerHTML = D[k]; });
  $$("[data-rango]").forEach(function(el){ el.classList.toggle("sin", numO(leer(l, el.dataset.k))==null); });
  // V5.137 · al escribir un cuarto de punto en la casilla fina, los nueve botones se ponen al día sin repintar (se perdería el foco).
  $$("[data-a=\"aff\"]").forEach(function(el){ const on = numO(l["cva_"+el.dataset.v])===+el.dataset.i; el.classList.toggle("on", on); el.setAttribute("aria-pressed", String(on)); });
  $$("[data-bar]").forEach(function(el){ el.style.width = (D["bar."+el.dataset.bar]||0)+"%"; });
  if(UI.tab==="extr"){
    const of = oficiales(l).o;
    $$("[data-of]").forEach(function(el){ el.classList.toggle("on", !!of[el.dataset.of]); });
    const dm = $("#dl-munis");
    if(dm && dm.dataset.r!==l.ext.region){ dm.dataset.r = l.ext.region; dm.innerHTML = (DEP_MUNI[l.ext.region]||[]).map(function(m){ return "<option value=\""+esc(m)+"\">"; }).join(""); }
  }
}
function pintarTop(){
