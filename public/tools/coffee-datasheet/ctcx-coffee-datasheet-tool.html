<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTCx Coffee Datasheet Tool · Evaluación SCA 2004 o CVA de lotes de café</title>
<meta name="description" content="Evalúa lotes de café con el protocolo SCA 2004 o con el CVA: perfil de sabores, granulometría y ficha extrínseca. Colombian Trading Company SAS · ctcexport.com">
<style>
/* ── CTCx Coffee Datasheet Tool (V5.132) ────────────────────────────────────
   Nace de combinar la Rueda del Café (V23) y la Ficha de café verde (V5).
   El MÉTODO manda en toda la pantalla: body[data-m] cambia la cinta, los
   acentos y las casillas. SCA 2004 = azul marino · CVA = dorado y morado. */
:root{
  --purple:#3C0A86; --purple-dim:#2A0760; --lav:#D3B8FA; --gold:#FFCD00; --navy:#003087; --crimson:#C8102F;
  --ink:#15121F; --soft:#56526B; --faint:#8E8AA3; --line:#DDD9EE; --line-soft:#ECEAF8;
  --paper:#F7F6FB; --panel:#FFFFFF; --ok:#1A6B3C; --ok-bg:#E8F5EE; --warn:#9A5B00; --warn-bg:#FFF4D6; --bad-bg:#FDECEF;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:'Helvetica Neue',Arial,'Segoe UI',system-ui,sans-serif;
  --m:#3C0A86; --m-bg:#3C0A86; --m-fg:#fff; --m-soft:#F2EDFD; --m-line:#D3B8FA;
  --desc:#0B5C6B; --desc-soft:#E6F3F5; --aff:#8A1C7C; --aff-soft:#F8E9F6;
}
body[data-m="sca"]{ --m:#003087; --m-bg:#003087; --m-fg:#fff; --m-soft:#EEF3FB; --m-line:#BDD0EE; }
body[data-m="cva"]{ --m:#3C0A86; --m-bg:#FFCD00; --m-fg:#2A0760; --m-soft:#F2EDFD; --m-line:#D3B8FA; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:var(--mono);font-size:13px;color:var(--ink)}
a{color:var(--m)}

/* ── barra superior ── */
.top{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;min-height:52px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:11px;margin-right:auto;padding:8px 0}
.marca .logo{background:var(--gold);color:var(--purple);font-weight:900;font-size:12px;letter-spacing:-.3px;border-radius:3px;padding:7px 7px}
.marca b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;display:block;line-height:1.15}
.marca small{font-family:var(--mono);font-size:10px;color:var(--lav);letter-spacing:.05em}
.acc-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0}
.bt{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:3px;padding:7px 11px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;min-height:34px}
.bt:hover{background:rgba(255,255,255,.18)}
.bt.oro{background:var(--gold);border-color:var(--gold);color:var(--purple-dim);font-weight:700}
.idiomas{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.idiomas button{background:none;border:none;color:#cfcbe2;font-family:var(--mono);font-size:11px;padding:7px 9px;min-height:34px}
.idiomas button.on{background:#fff;color:var(--ink);font-weight:700}

/* ── la cinta del método: lo que no se puede dejar de ver ── */
.cinta{position:sticky;top:var(--top-h,52px);z-index:45;background:var(--m-bg);color:var(--m-fg);display:flex;align-items:center;gap:12px;padding:8px 18px;flex-wrap:wrap;border-bottom:3px solid rgba(0,0,0,.18)}
.cinta[hidden]{display:none}
.cinta .sello{font-weight:900;font-size:17px;letter-spacing:.04em;white-space:nowrap}
.cinta .que{font-size:12.5px;flex:1;min-width:220px;line-height:1.35}
.cinta .que b{font-weight:700}
.cinta button{background:rgba(255,255,255,.16);border:1px solid currentColor;border-radius:3px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:inherit;min-height:32px}
body[data-m="cva"] .cinta button{background:rgba(42,7,96,.08)}
.cinta .i{border-color:currentColor;color:inherit;background:none}

.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 90px}

/* ── botón «i» ── */
.i{width:19px;height:19px;border-radius:50%;border:1px solid var(--m-line);background:#fff;color:var(--m);font-size:11px;font-weight:700;font-family:Georgia,serif;font-style:italic;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;line-height:1;padding:0;vertical-align:middle}
.i:hover{background:var(--m-soft)}
.i{position:relative}
.i::after{content:"";position:absolute;inset:-10px}
@media(max-width:760px){.top{position:static}.cinta{top:0;padding:6px 14px}.cinta .que{display:none}.cinta .sello{margin-right:auto}}

/* ── elegir método ── */
.elige{margin:10px 0 18px}
.elige h1{font-size:22px;letter-spacing:-.01em;margin-bottom:4px}
.elige p.lede{color:var(--soft);max-width:78ch;margin-bottom:16px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.dos{grid-template-columns:1fr}}
.metodo{border:2px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.metodo .cab{padding:14px 16px;color:#fff}
.metodo.sca .cab{background:#003087}
.metodo.cva .cab{background:#FFCD00;color:#2A0760}
.metodo .cab .n{font-size:22px;font-weight:900;letter-spacing:.03em}
.metodo .cab .s{font-size:12.5px;opacity:.92}
.metodo .cab .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:1px 7px;margin-top:6px}
.metodo ul{list-style:none;padding:14px 16px;flex:1}
.metodo li{padding:5px 0 5px 18px;position:relative;font-size:13px;border-bottom:1px dotted var(--line-soft)}
.metodo li::before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.metodo .pie{padding:0 16px 16px;display:flex;justify-content:flex-end}
.metodo .pie button{border:none;border-radius:3px;padding:11px 16px;font-weight:700;font-size:13px;min-height:44px}
.metodo.sca .pie button{background:#003087;color:#fff}
.metodo.cva .pie button{background:#3C0A86;color:#fff}
.aviso{margin-top:14px;background:var(--warn-bg);border:1px solid #F0D48A;border-left:4px solid var(--gold);border-radius:3px;padding:10px 14px;font-size:13px;color:#4d3800}

/* ── sesión, lotes, partes ── */
.caja{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
.caja>.cab{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--m-soft);border-bottom:1px solid var(--line)}
.caja>.cab h2{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--m);font-weight:700;flex:1}
.caja>.cab .idx{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--m-fg);background:var(--m-bg);border-radius:2px;padding:2px 7px;font-weight:700}
.caja>.cab .std{font-family:var(--mono);font-size:10px;color:var(--soft);border:1px solid var(--m-line);border-radius:2px;padding:1px 6px;background:#fff;white-space:nowrap}
.caja>.cuerpo{padding:13px 14px}
.caja.acordeon>.cab{cursor:pointer}
.caja.acordeon>.cab .flecha{font-family:var(--mono);color:var(--m);font-size:12px}
.caja.acordeon:not(.abierta)>.cuerpo{display:none}
.caja.acordeon:not(.abierta)>.cab{border-bottom:none}

.lotes{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.lote{border:1px solid var(--line);background:#fff;border-radius:3px;padding:7px 11px;font-family:var(--mono);font-size:12px;min-height:38px;display:inline-flex;gap:7px;align-items:center}
.lote.on{border-color:var(--m);background:var(--m-soft);box-shadow:inset 0 0 0 1px var(--m);color:var(--m);font-weight:700}
.lote .p{font-weight:400;color:var(--soft);font-size:11px}
.mini{border:1px dashed var(--m);background:#fff;color:var(--m);border-radius:3px;padding:7px 11px;font-family:var(--mono);font-size:11.5px;min-height:38px}
.mini:hover{background:var(--m-soft)}
.mini.rojo{border-color:var(--crimson);color:var(--crimson)}
.partes{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
.partes .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.parte{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;background:#fff;min-height:34px}
.parte.on{border-color:var(--m);background:var(--m-soft);color:var(--m);font-weight:700}
.parte .cq{width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1}

/* ── pestañas ── */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin:14px 0 14px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;padding:11px 15px 9px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);white-space:nowrap;min-height:44px}
.tab .n{color:var(--m-line);font-weight:700;margin-right:6px}
.tab.on{color:var(--m);border-bottom-color:var(--m);font-weight:700}
.tab.on .n{color:var(--m)}
.tab small{display:block;text-transform:none;letter-spacing:0;font-size:10px;color:var(--faint);font-weight:400}

/* ── campos ── */
.grid{display:grid;gap:11px 15px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
@media(max-width:760px){.s2,.s3,.s4{grid-column:auto}}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo>label,.etq{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--soft);text-transform:uppercase}
.campo input,.campo select,.campo textarea{background:#fff;border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%;min-height:36px}
.campo textarea{min-height:64px;resize:vertical;line-height:1.45;font-family:var(--sans)}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--m);box-shadow:0 0 0 2px rgba(60,10,134,.12)}
.campo .pista{font-size:10.5px;color:var(--faint);font-family:var(--mono);line-height:1.4}
.ofi{width:14px;height:14px;border:1.5px solid var(--line);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex:0 0 auto}
.ofi.on{border-color:var(--ok);background:var(--ok);color:#fff}
.nota-m{background:var(--m-soft);border-left:3px solid var(--m);padding:9px 12px;font-size:12.5px;color:var(--soft);border-radius:0 3px 3px 0;margin-bottom:12px;line-height:1.5}
.nota-m b{color:var(--m)}

/* ── panel de puntaje ── */
.puntaje{background:var(--ink);border-radius:5px;padding:14px 16px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:14px;align-items:center;color:#fff}
@media(max-width:700px){.puntaje{grid-template-columns:1fr}}
.puntaje .num{font-family:var(--mono);font-size:46px;font-weight:700;line-height:1}
.puntaje .num small{font-size:17px;color:#8884AA}
.puntaje .cual{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:2px;margin:6px 0;background:var(--m-bg);color:var(--m-fg);font-weight:700}
.puntaje .cls{font-size:13px;color:#fff;font-weight:700}
.puntaje .det{font-family:var(--mono);font-size:11px;color:#B5B1CC;line-height:1.55;margin-top:6px}
.puntaje .falta{color:#FFD9A0}
.radar{width:100%;max-width:300px;display:block;margin:0 auto;overflow:visible}
.radar .rg{fill:none;stroke:#3A3550;stroke-width:.6}
.radar .ra{stroke:#3A3550;stroke-width:.6}
.radar .rl{font-family:var(--mono);font-size:6.6px;fill:#B5B1CC;text-anchor:middle;dominant-baseline:middle}
.radar .rp{stroke-width:1.5;fill-opacity:.22}
.radar .rp.a,.radar .rd.a{stroke:#FFCD00;fill:#FFCD00}
.radar .rp.b,.radar .rd.b{stroke:#7FD3E0;fill:#7FD3E0}
.radar .rd{fill-opacity:1;stroke:none}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:#B5B1CC;margin-top:6px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ── filas de atributo (SCA 2004) ── */
.fila{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(120px,2fr) 62px minmax(84px,auto) 30px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.fila:last-child{border-bottom:none}
@media(max-width:700px){.fila{grid-template-columns:1fr 62px 30px}.fila .fl{grid-column:1/-1}.fila .pal{display:none}}
.fila.tz{grid-template-columns:minmax(150px,1.1fr) minmax(0,2fr) 62px}
@media(max-width:700px){.fila.tz{grid-template-columns:1fr 62px}}
.fila .fl{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.fila output{font-family:var(--mono);font-weight:700;font-size:15px;text-align:right;color:var(--m)}
.fila .pal{font-family:var(--mono);font-size:10.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.fila .sub{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--soft);margin-top:-2px}
.x{background:none;border:1px solid var(--line);border-radius:3px;color:var(--faint);width:28px;height:28px;font-size:14px;line-height:1}
.x:hover{color:var(--crimson);border-color:var(--crimson)}
input[type=range]{width:100%;accent-color:var(--m);min-height:30px}
input[type=range].sin{opacity:.38}
.tazas{display:flex;gap:6px;flex-wrap:wrap}
.taza{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;font-family:var(--mono);font-size:12px;color:var(--faint)}
.taza.on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.taza.mal{border-color:var(--crimson);background:var(--bad-bg);color:var(--crimson);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:#fff;border:none;border-right:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:11px;min-height:32px;color:var(--soft)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--m);color:#fff;font-weight:700}

/* ── CVA: las dos columnas que no se mezclan ── */
.cva-sec{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;margin-bottom:12px}
@media(max-width:820px){.cva-sec{grid-template-columns:1fr}}
.cva-sec>.tit{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--m-soft);border-bottom:1px solid var(--line)}
.cva-sec>.tit h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--m);flex:1}
.col-d,.col-a{padding:12px 14px}
.col-d{border-right:1px solid var(--line);background:linear-gradient(var(--desc-soft),var(--desc-soft)) top/100% 3px no-repeat}
.col-a{background:linear-gradient(var(--aff-soft),var(--aff-soft)) top/100% 3px no-repeat}
@media(max-width:820px){.col-d{border-right:none;border-bottom:1px solid var(--line)}}
.rot{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.col-d .rot{color:var(--desc)}.col-a .rot{color:var(--aff)}
.rot small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--soft);font-size:10.5px}
.int{display:grid;grid-template-columns:minmax(96px,auto) 1fr 44px 30px;gap:9px;align-items:center;margin-bottom:6px}
.int .nm{font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center}
.int output{font-family:var(--mono);font-weight:700;color:var(--desc);text-align:right}
.col-d input[type=range]{accent-color:var(--desc)}
.zonas{display:grid;grid-template-columns:1fr 1fr 1fr;font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.08em;margin:-4px 74px 8px 105px;text-align:center}
@media(max-width:560px){.zonas{margin-left:0;margin-right:0}}
.cajas{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.cj{border:1px solid var(--line);background:#fff;border-radius:3px;padding:6px 9px;font-size:12px;min-height:32px;display:inline-flex;align-items:center;gap:5px}
.cj.hija{font-size:11.5px;color:var(--soft);border-style:dashed}
.cj.on{border-color:var(--desc);background:var(--desc);color:#fff;font-weight:700;border-style:solid}
.cj.imp{border-color:var(--desc);background:var(--desc-soft);color:var(--desc);border-style:solid}
.grupo-cj{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;margin:0 8px 5px 0;padding:3px;border-radius:4px;background:#FAFAFD}
.cuenta{font-family:var(--mono);font-size:10.5px;color:var(--soft);margin-left:auto}
.cuenta.lleno{color:var(--warn);font-weight:700}
.nueve{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:360px}
.nueve button{border:1px solid var(--line);background:#fff;border-radius:50%;aspect-ratio:1;font-family:var(--mono);font-size:13px;min-width:30px;color:var(--soft)}
.nueve button.on{background:var(--aff);border-color:var(--aff);color:#fff;font-weight:700}
.nueve button.medio{border-style:dashed;border-color:var(--aff)}
.af{margin-bottom:10px}
.af .nm{font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center;margin-bottom:5px}
.af .dice{font-family:var(--mono);font-size:10.5px;color:var(--aff);margin-top:4px;min-height:15px}
.col-d textarea,.col-a textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:7px 9px;min-height:46px;font-family:var(--sans);font-size:12.5px;resize:vertical;margin-top:4px}
.sub-etq{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);display:flex;gap:6px;align-items:center;margin-top:9px}
.cva-tz{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:700px){.cva-tz{grid-template-columns:repeat(2,1fr)}}
.cva-tz .t{border:1px solid var(--line);border-radius:4px;padding:8px;text-align:center;background:#fff}
.cva-tz .t b{display:block;font-family:var(--mono);font-size:11px;margin-bottom:6px}
.cva-tz .t button{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:3px;padding:6px 4px;font-size:11px;margin-bottom:5px;min-height:32px}
.cva-tz .t button.on{background:var(--warn-bg);border-color:var(--gold);color:#4d3800;font-weight:700}
.cva-tz .t button.def.on{background:var(--bad-bg);border-color:var(--crimson);color:var(--crimson)}
.cva-tz .t select{width:100%;padding:5px;border:1px solid var(--crimson);border-radius:3px;font-size:11.5px}

/* ── la rueda ── */
.rueda-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.rueda-wrap{grid-template-columns:1fr}}
.rueda{width:100%;max-width:640px;display:block;margin:0 auto;touch-action:manipulation}
.rueda .w{cursor:pointer;stroke:#fff;stroke-width:1;transition:opacity .12s}
.rueda .w:hover{opacity:.78}
.rueda .w.on{stroke:#15121F;stroke-width:3}
.rueda text{pointer-events:none;font-family:var(--sans)}
.rueda .l2{font-size:13px;font-weight:600}
.rueda .l3{font-size:11.5px}

icos","n":["Cítricos","Citrus Fruit","Zitrusfrüchte"],"d":["Acidez brillante y refrescante: la firma de los cafés lavados de altura.","Bright, refreshing acidity: the signature of high-altitude washed coffees.","Strahlende, erfrischende Säure: die Signatur gewaschener Höhenkaffees."],"h":[{"id":"toronja","n":["Toronja","Grapefruit","Grapefruit"],"d":["Ácida y ligeramente amarga, muy refrescante.","Tart and slightly bitter, very refreshing.","Säuerlich und leicht bitter, sehr erfrischend."]},{"id":"naranja","n":["Naranja","Orange","Orange"],"d":["Dulce-ácida, jugosa y brillante.","Sweet-tart, juicy, and bright.","Süß-säuerlich, saftig und strahlend."]},{"id":"limon","n":["Limón","Lemon","Zitrone"],"d":["Muy ácido y fresco, con aroma de cáscara.","Very tart and fresh, with a zesty peel aroma.","Sehr säuerlich und frisch, mit einem Aroma von Zitronenschale."]},{"id":"lima","n":["Lima","Lime","Limette"],"d":["Ácida, verde y punzante.","Tart, green, and sharp.","Säuerlich, grün und spritzig."]}]}]},
  {"id":"acido","n":["Ácido / Fermentado","Sour / Fermented","Säuerlich / Fermentiert"],"c":"#b5c33b","i":"🍷","d":["Subproductos de la fermentación: ácidos orgánicos y notas vinosas que, en su justa medida, dan viveza — y en exceso delatan un proceso defectuoso.","Byproducts of fermentation: organic acids and winey notes that, in the right amount, add liveliness — and in excess reveal a flawed process.","Nebenprodukte der Fermentation: organische Säuren und weinige Noten, die in Maßen Lebendigkeit verleihen — im Übermaß aber einen fehlerhaften Prozess verraten."],"s":[{"id":"acido-acidos","n":["Ácido","Sour","Säure"],"d":["Ácidos orgánicos específicos que el catador entrenado aprende a distinguir por separado.","Specific organic acids that a trained taster learns to tell apart individually.","Spezifische organische Säuren, die ein geschulter Verkoster einzeln unterscheiden lernt."],"h":[{"id":"acido-acetico","n":["Ácido acético","Acetic Acid","Essigsäure"],"d":["Punzante como vinagre; en dosis baja aporta viveza, pero en exceso es señal de sobrefermentación.","Sharp like vinegar; in small amounts it adds liveliness, but in excess it signals over-fermentation.","Scharf wie Essig; in kleiner Dosis sorgt sie für Lebendigkeit, im Übermaß signalisiert sie Überfermentation."]},{"id":"acido-butirico","n":["Ácido butírico","Butyric Acid","Buttersäure"],"d":["Notas lácteas agrias, recuerda a mantequilla rancia; casi siempre indica un problema de proceso.","Sour dairy notes, reminiscent of rancid butter; almost always a sign of a process issue.","Säuerliche Milchnoten, erinnert an ranzige Butter; fast immer ein Zeichen eines Prozessfehlers."]},{"id":"acido-isovalerico","n":["Ácido isovalérico","Isovaleric Acid","Isovaleriansäure"],"d":["Agrio y a queso; señal de sobrefermentación si es intenso.","Sour and cheesy; a sign of over-fermentation when intense.","Säuerlich und käsig; bei starker Ausprägung ein Zeichen von Überfermentation."]},{"id":"acido-citrico","n":["Ácido cítrico","Citric Acid","Zitronensäure"],"d":["Fresco y jugoso, como un cítrico maduro — acidez deseable y bien valorada.","Fresh and juicy, like a ripe citrus fruit — a desirable, well-regarded acidity.","Frisch und saftig, wie eine reife Zitrusfrucht — eine erwünschte, geschätzte Säure."]},{"id":"acido-malico","n":["Ácido málico","Malic Acid","Apfelsäure"],"d":["Crujiente, recuerda a la manzana verde — acidez limpia, típica de un beneficio bien controlado.","Crisp, reminiscent of green apple — a clean acidity typical of a well-controlled process.","Knackig, erinnert an grünen Apfel — eine saubere Säure, typisch für eine gut kontrollierte Aufbereitung."]}]},{"id":"acido-fermentado","n":["Fermentado","Fermented","Fermentiert"],"d":["Notas que evocan la fermentación alcohólica, deseables solo con moderación; en exceso delatan un beneficio descontrolado.","Notes that evoke alcoholic fermentation, desirable only in moderation; in excess they reveal an uncontrolled process.","Noten, die an alkoholische Gärung erinnern, nur in Maßen erwünscht; im Übermaß verraten sie eine unkontrollierte Aufbereitung."],"h":[{"id":"vinoso","n":["Vinoso","Winey","Weinig"],"d":["Recuerda a un vino tinto joven; agradable con moderación en procesos naturales o fermentaciones controladas.","Reminiscent of a young red wine; pleasant in moderation in naturals or controlled fermentations.","Erinnert an einen jungen Rotwein; in Maßen angenehm bei Naturals oder kontrollierten Fermentationen."]},{"id":"whiskey","n":["Whiskey","Whiskey","Whiskey"],"d":["Cálido y alcohólico, con dulzor de barrica; deseable en dosis baja, defecto si domina la taza.","Warm and boozy, with barrel-aged sweetness; desirable in small amounts, a flaw if it dominates the cup.","Warm und alkoholisch, mit fassgereifter Süße; in kleiner Dosis erwünscht, als Fehlton problematisch, wenn er die Tasse dominiert."]},{"id":"fermentado","n":["Fermentado","Fermented","Fermentiert"],"d":["Notas agrias y activas, típicas de exceso de fermentación.","Sour, active notes typical of excess fermentation.","Säuerliche, lebhafte Noten, typisch für übermäßige Gärung."]},{"id":"sobremaduro","n":["Sobremaduro","Overripe","Überreif"],"d":["Fruta pasada de madurez: dulce y ligeramente alcohólica.","Fruit past its peak ripeness: sweet and slightly boozy.","Frucht jenseits ihres Reifepunkts: süß und leicht alkoholisch."]}]}]},
  {"id":"verde","n":["Verde / Vegetal","Green / Vegetative","Grün / Vegetabil"],"c":"#4f8f5b","i":"🌿","d":["El territorio de lo insuficientemente maduro o tostado: notas herbáceas y vegetales, dominantes en cafés verdes o infratostados.","The territory of the underripe or underroasted: herbaceous, vegetal notes that dominate in green or underdeveloped coffees.","Das Terrain des Unreifen oder Unterrösteten: krautig-vegetabile Noten, die in grünen oder unterentwickelten Kaffees dominieren."],"s":[{"id":"verde-crudo","n":["Crudo","Raw","Roh"],"d":["Notas de grano sin tostar, aceitosas y vegetales — casi siempre apuntan al tueste, no a la variedad.","Notes of unroasted, oily, vegetal grain — almost always point to the roast, not the varietal.","Noten ungerösteter, öliger, vegetabiler Bohne — fast immer ein Hinweis auf die Röstung, nicht auf die Sorte."],"h":[{"id":"aceite-de-oliva","n":["Aceite de oliva","Olive Oil","Olivenöl"],"d":["Untuosa y vegetal, con un dejo aceitoso.","Rich and vegetal, with an oily edge.","Vollmundig und vegetabil, mit einer öligen Note."]},{"id":"crudo","n":["Crudo","Raw","Roh"],"d":["Sabor a grano verde, sin desarrollar.","Tastes like green, undeveloped grain.","Schmeckt nach grüner, unentwickelter Bohne."]}]},{"id":"verde-vegetal","n":["Vegetal","Vegetative","Vegetabil"],"d":["El corazón vegetal: del pasto recién cortado al heno seco.","The vegetal core: from freshly cut grass to dry hay.","Der vegetabile Kern: von frisch gemähtem Gras bis trockenem Heu."],"h":[{"id":"verde","n":["Verde","Green","Grün"],"d":["Vegetal fresco, sin madurar.","Fresh, unripened vegetal note.","Frische, unreife vegetabile Note."]},{"id":"vaina-de-chicharo","n":["Vaina de chícharo","Pea Pod","Erbsenschote"],"d":["Verde y ligeramente dulce.","Green and slightly sweet.","Grün und leicht süß."]},{"id":"fresco","n":["Fresco","Fresh","Frisch"],"d":["Vegetal limpio, como hoja recién cortada.","Clean and vegetal, like a freshly cut leaf.","Sauber und vegetabil, wie ein frisch geschnittenes Blatt."]},{"id":"verde-oscuro","n":["Verde oscuro","Dark Green","Dunkelgrün"],"d":["Vegetal intenso, algo amargo.","Intense vegetal note, somewhat bitter.","Intensive vegetabile Note, etwas bitter."]},{"id":"vegetal","n":["Vegetal","Vegetative","Vegetabil"],"d":["Nota general de verdura cocida.","A general note of cooked vegetables.","Eine allgemeine Note von gekochtem Gemüse."]},{"id":"heno","n":["Heno","Hay-like","Heuartig"],"d":["Seco y dulzón, como pasto secado al sol.","Dry and sweetish, like sun-dried grass.","Trocken und süßlich, wie sonnengetrocknetes Gras."]},{"id":"herbaceo","n":["Herbáceo","Herb-like","Krautig"],"d":["Recuerda a hierbas frescas de cocina.","Reminiscent of fresh culinary herbs.","Erinnert an frische Küchenkräuter."]}]},{"id":"verde-frijol","n":["A frijol","Beany","Bohnig"],"d":["Recuerda a la legumbre cruda; propio de un tueste muy claro o de cereza recién cosechada.","Reminiscent of raw legume; typical of a very light roast or freshly harvested cherry.","Erinnert an rohe Hülsenfrüchte; typisch für eine sehr helle Röstung oder frisch geerntete Kirschen."],"h":[{"id":"a-frijol","n":["A frijol","Beany","Bohnig"],"d":["Crudo y almidonado, como frijol sin cocinar.","Raw and starchy, like an uncooked bean.","Roh und stärkehaltig, wie eine ungekochte Bohne."]}]}]},
  {"id":"otros","n":["Otros","Other","Sonstige"],"c":"#4e8fa8","i":"🧪","d":["Notas atípicas — papel, humedad, productos químicos — que suelen señalar defectos de almacenamiento, transporte o beneficio, más que una característica del varietal.","Atypical notes — paper, mustiness, chemical off-flavors — that usually point to a storage, transport, or processing defect rather than a varietal trait.","Untypische Noten — Papier, Modrigkeit, chemische Fehltöne — die meist auf einen Lager-, Transport- oder Aufbereitungsfehler hinweisen und nicht auf ein Sortenmerkmal."],"s":[{"id":"otros-papel","n":["Papel / Mohoso","Papery / Musty","Papierig / Muffig"],"d":["Aromas de deterioro: humedad, moho y envejecimiento del grano verde. Casi siempre son señal de un problema de poscosecha, no del varietal.","Aromas of decline: dampness, mold, and aging green coffee. Almost always a sign of a post-harvest issue, not a varietal trait.","Aromen des Verfalls: Feuchtigkeit, Schimmel und gealterter Rohkaffee. Fast immer ein Zeichen eines Nachernteproblems, kein Sortenmerkmal."],"h":[{"id":"rancio","n":["Rancio","Stale","Ranzig"],"d":["Aceites oxidados, como grano envejecido.","Oxidized oils, like aged coffee.","Oxidierte Öle, wie gealterter Kaffee."]},{"id":"carton","n":["Cartón","Cardboard","Karton"],"d":["Seco y a celulosa, típico de café viejo.","Dry and cellulose-like, typical of old coffee.","Trocken und zellstoffartig, typisch für alten Kaffee."]},{"id":"papel","n":["Papel","Papery","Papierig"],"d":["Plano y seco, sin frescura.","Flat and dry, lacking freshness.","Flach und trocken, ohne Frische."]},{"id":"amaderado","n":["Amaderado","Woody","Holzig"],"d":["Seco, recuerda a madera vieja.","Dry, reminiscent of old wood.","Trocken, erinnert an altes Holz."]},{"id":"mohoso-humedo","n":["Mohoso / Húmedo","Moldy / Damp","Schimmlig / Feucht"],"d":["Aroma a humedad estancada.","Aroma of stagnant moisture.","Aroma stehender Feuchtigkeit."]},{"id":"polvoso-mohoso","n":["Polvoso / Mohoso","Dusty / Musty","Staubig / Muffig"],"d":["Terroso y a polvo cerrado.","Earthy and stuffy, like closed-up dust.","Erdig und dumpf, wie eingeschlossener Staub."]},{"id":"terroso-mohoso","n":["Terroso / Mohoso","Earthy / Musty","Erdig / Muffig"],"d":["Tierra húmeda, sótano.","Damp earth, basement-like.","Feuchte Erde, kellerartig."]},{"id":"animal","n":["Animal","Animalic","Animalisch"],"d":["Nota curtida, cercana a establo.","A tannic note, close to a barnyard.","Eine gerbige Note, nahe an einem Stall."]},{"id":"caldo-de-carne","n":["Caldo de carne","Meaty Broth","Fleischbrühe"],"d":["Salado y umami, poco común.","Salty and umami, uncommon.","Salzig und umami, selten."]},{"id":"fenolico","n":["Fenólico","Phenolic","Phenolisch"],"d":["Químico y agresivo — casi siempre defecto grave.","Chemical and harsh — almost always a serious defect.","Chemisch und aggressiv — fast immer ein schwerwiegender Fehler."]}]},{"id":"otros-quimico","n":["Químico","Chemical","Chemisch"],"d":["Notas industriales o medicinales, casi siempre indeseables en taza y ajenas al varietal.","Industrial or medicinal notes, almost always undesirable in the cup and unrelated to the varietal.","Industrielle oder medizinische Noten, in der Tasse fast immer unerwünscht und unabhängig von der Sorte."],"h":[{"id":"amargo","n":["Amargo","Bitter","Bitter"],"d":["Sabor básico intenso, sin matices, cuando domina la taza.","An intense, flat basic taste when it dominates the cup.","Ein intensiver, eindimensionaler Grundgeschmack, wenn er die Tasse dominiert."]},{"id":"salado","n":["Salado","Salty","Salzig"],"d":["Sabor básico mineral, poco común en café limpio.","A mineral basic taste, uncommon in a clean coffee.","Ein mineralischer Grundgeschmack, selten bei sauberem Kaffee."]},{"id":"medicinal","n":["Medicinal","Medicinal","Medizinisch"],"d":["Recuerda a jarabe o antiséptico.","Reminiscent of syrup or antiseptic.","Erinnert an Sirup oder Antiseptikum."]},{"id":"petroleo","n":["Petróleo","Petroleum","Petroleum"],"d":["Aceitoso y penetrante.","Oily and pervasive.","Ölig und durchdringend."]},{"id":"skunky","n":["Skunky","Skunky","Stinkig"],"d":["Fuerte y desagradable, como azufre.","Strong and unpleasant, like sulfur.","Stark und unangenehm, wie Schwefel."]},{"id":"caucho","n":["Caucho","Rubber","Gummi"],"d":["Aroma a hule quemado.","Aroma of burnt rubber.","Aroma von verbranntem Gummi."]}]}]},
  {"id":"especias","n":["Especias","Spices","Gewürze"],"c":"#8b4a6b","i":"🌶️","d":["El picante y las especias oscuras que emergen del desarrollo de azúcares durante el tueste.","The pungency and dark spices that emerge from sugar development during roasting.","Die Schärfe und dunklen Gewürznoten, die durch die Zuckerentwicklung beim Rösten entstehen."],"s":[{"id":"especias-pungente","n":["Pungente","Pungent","Scharf"],"d":["Sensación táctil de picor en lengua y paladar más que un aroma propiamente dicho.","A tactile sensation of pungency on the tongue and palate more than an aroma as such.","Eher eine taktile Schärfeempfindung auf Zunge und Gaumen als ein eigentliches Aroma."],"h":[{"id":"pungente","n":["Pungente","Pungent","Scharf"],"d":["Picor difuso, activa el paladar.","A diffuse pungency that activates the palate.","Eine diffuse Schärfe, die den Gaumen aktiviert."]},{"id":"pimienta","n":["Pimienta","Pepper","Pfeffer"],"d":["Picante y seco, como pimienta negra recién molida.","Spicy and dry, like freshly ground black pepper.","Scharf und trocken, wie frisch gemahlener schwarzer Pfeffer."]}]},{"id":"especias-oscuras","n":["Especias oscuras","Brown Spice","Dunkle Gewürze"],"d":["Especias cálidas y dulces, típicas de tuestes medio-oscuros.","Warm, sweet spices typical of medium-dark roasts.","Warme, süße Gewürznoten, typisch für mittel-dunkle Röstungen."],"h":[{"id":"anis","n":["Anís","Anise","Anis"],"d":["Dulce y herbal, con un toque de regaliz.","Sweet and herbal, with a touch of licorice.","Süß und krautig, mit einem Hauch Lakritz."]},{"id":"nuez-moscada","n":["Nuez moscada","Nutmeg","Muskatnuss"],"d":["Cálida, dulce y ligeramente terrosa.","Warm, sweet, and slightly earthy.","Warm, süß und leicht erdig."]},{"id":"canela","n":["Canela","Cinnamon","Zimt"],"d":["Dulce y cálida, muy reconocible.","Sweet and warm, very recognizable.","Süß und warm, sehr wiedererkennbar."]},{"id":"clavo-de-olor","n":["Clavo de olor","Clove","Gewürznelke"],"d":["Intenso, cálido y ligeramente picante.","Intense, warm, and slightly spicy.","Intensiv, warm und leicht scharf."]}]}]},
  {"id":"tostado","n":["Tostado","Roasted","Röstig"],"c":"#a97c50","i":"🔥","d":["El sabor directo del proceso de tueste: de los granos y maltas suaves hasta el carbón y el humo intenso.","The direct flavor of the roasting process: from mild grain and malt to charcoal and intense smoke.","Der direkte Geschmack des Röstprozesses: von mildem Getreide und Malz bis hin zu Kohle und intensivem Rauch."],"s":[{"id":"tostado-tabaco","n":["Tabaco","Tobacco","Tabak"],"d":["Notas curtidas y aromáticas, cercanas al tabaco seco.","Tannic, aromatic notes, close to dry tobacco leaf.","Gerbige, aromatische Noten, nahe an trockenem Tabakblatt."],"h":[{"id":"tabaco-de-pipa","n":["Tabaco de pipa","Pipe Tobacco","Pfeifentabak"],"d":["Dulce, curtido y aromático.","Sweet, tannic, and aromatic.","Süß, gerbig und aromatisch."]},{"id":"tabaco","n":["Tabaco","Tobacco","Tabak"],"d":["Seco y curtido, sin el dulzor de la pipa.","Dry and tannic, without the sweetness of pipe tobacco.","Trocken und gerbig, ohne die Süße des Pfeifentabaks."]}]},{"id":"tostado-quemado","n":["Quemado","Burnt","Verbrannt"],"d":["El límite superior del tueste: notas acres y carbonizadas — casi siempre indican un tueste llevado demasiado lejos.","The upper limit of roasting: acrid, charred notes — almost always a sign the roast was pushed too far.","Die Obergrenze der Röstung: beißende, verkohlte Noten — fast immer ein Zeichen einer zu weit getriebenen Röstung."],"h":[{"id":"acre","n":["Acre","Acrid","Beißend"],"d":["Punzante y áspero, tueste muy oscuro.","Sharp and harsh, a very dark roast.","Scharf und rau, eine sehr dunkle Röstung."]},{"id":"cenizo","n":["Cenizo","Ashy","Aschig"],"d":["A ceniza fría, seco y polvoso.","Like cold ash, dry and dusty.","Wie kalte Asche, trocken und staubig."]},{"id":"ahumado","n":["Ahumado","Smoky","Rauchig"],"d":["Humo directo, intenso.","Direct, intense smoke.","Direkter, intensiver Rauch."]},{"id":"curtido","n":["Curtido","Brown, Roast","Gegerbt"],"d":["Seco y áspero al final de boca.","Dry and rough on the finish.","Trocken und rau im Abgang."]},{"id":"tostado-intenso","n":["Tostado intenso","Dark Roast","Dunkle Röstung"],"d":["Amargor concentrado de tueste oscuro.","Concentrated bitterness of a dark roast.","Konzentrierte Bitterkeit einer dunklen Röstung."]}]},{"id":"tostado-cereal","n":["Cereal","Cereal","Getreide"],"d":["Notas tostadas suaves, a grano y malta; comunes en tuestes claros a medios.","Mild toasted notes of grain and malt; common in light to medium roasts.","Milde geröstete Noten von Getreide und Malz; häufig bei hellen bis mittleren Röstungen."],"h":[{"id":"grano","n":["Grano","Grain","Getreide"],"d":["Suave, a cereal seco.","Mild, like dry cereal.","Mild, wie trockenes Getreide."]},{"id":"malta","n":["Malta","Malt","Malz"],"d":["Dulce y tostada, como cebada malteada.","Sweet and toasted, like malted barley.","Süß und geröstet, wie gemälzte Gerste."]}]}]},
  {"id":"cacao","n":["Frutos secos / Cacao","Nutty / Cocoa","Nussig / Kakao"],"c":"#6b4226","i":"🍫","d":["El territorio clásico del \"sabor a café\": cacao, chocolate y frutos secos tostados.","The classic \"coffee flavor\" territory: cocoa, chocolate, and roasted nuts.","Das klassische Terrain des \"Kaffeegeschmacks\": Kakao, Schokolade und geröstete Nüsse."],"s":[{"id":"cacao-secos","n":["Frutos secos","Nutty","Nussig"],"d":["Untuosos y tostados, base del cuerpo en muchos cafés lavados colombianos.","Rich and toasted, forming the body base of many washed Colombian coffees.","Vollmundig und geröstet, bildet die Körperbasis vieler gewaschener kolumbianischer Kaffees."],"h":[{"id":"cacahuate","n":["Cacahuate","Peanuts","Erdnuss"],"d":["Tostado y untuoso, ligeramente dulce.","Roasted and rich, slightly sweet.","Geröstet und vollmundig, leicht süß."]},{"id":"avellana","n":["Avellana","Hazelnut","Haselnuss"],"d":["Tostada y cremosa.","Toasted and creamy.","Geröstet und cremig."]},{"id":"almendra","n":["Almendra","Almond","Mandel"],"d":["Suave, ligeramente dulce y seca.","Mild, slightly sweet, and dry.","Mild, leicht süß und trocken."]}]},{"id":"cacao-cacao","n":["Cacao","Cocoa","Kakao"],"d":["El corazón del \"sabor a café\": dulzura amarga de cacao tostado, la firma clásica del café colombiano de cuerpo medio-alto.","The heart of \"coffee flavor\": the bittersweetness of roasted cocoa, the classic signature of medium-to-full-bodied Colombian coffee.","Das Herz des \"Kaffeegeschmacks\": die bittersüße Note gerösteten Kakaos, die klassische Signatur des mittel- bis vollmundigen kolumbianischen Kaffees."],"h":[{"id":"chocolate","n":["Chocolate","Chocolate","Schokolade"],"d":["Dulce y cremoso, redondo en boca.","Sweet and creamy, round in the mouth.","Süß und cremig, rund im Mund."]},{"id":"chocolate-amargo","n":["Chocolate amargo","Dark Chocolate","Zartbitterschokolade"],"d":["Intenso y amargo, con final seco.","Intense and bitter, with a dry finish.","Intensiv und bitter, mit trockenem Abgang."]}]}]},
  {"id":"dulce","n":["Dulce","Sweet","Süß"],"c":"#e8a33d","i":"🍯","d":["Los azúcares del café: caramelización, miel y vainilla que definen la percepción general de dulzor en taza.","The sugars of coffee: caramelization, honey, and vanilla that define the overall perception of sweetness in the cup.","Die Zucker des Kaffees: Karamellisierung, Honig und Vanille, die den allgemeinen Süßeeindruck in der Tasse prägen."],"s":[{"id":"dulce-morena","n":["Azúcar morena","Brown Sugar","Brauner Zucker"],"d":["Dulzor oscuro y denso, de la caramelización profunda de azúcares.","Dark, dense sweetness from deep sugar caramelization.","Dunkle, dichte Süße durch tiefe Zuckerkaramellisierung."],"h":[{"id":"melaza","n":["Melaza","Molasses","Melasse"],"d":["Oscura, densa y muy dulce.","Dark, dense, and very sweet.","Dunkel, dicht und sehr süß."]},{"id":"jarabe-de-maple","n":["Jarabe de maple","Maple Syrup","Ahornsirup"],"d":["Dulce, con notas amaderadas.","Sweet, with woody notes.","Süß, mit holzigen Noten."]},{"id":"caramelizado","n":["Caramelizado","Caramelized","Karamellisiert"],"d":["Dulzor tostado, redondo.","Toasted, round sweetness.","Geröstete, runde Süße."]},{"id":"miel","n":["Miel","Honey","Honig"],"d":["Dulce y floral, con textura untuosa.","Sweet and floral, with a rich texture.","Süß und blumig, mit vollmundiger Textur."]}]},{"id":"dulce-vainilla","n":["Vainilla / Dulce","Vanilla / Sweet","Vanille / Süß"],"d":["Dulzor claro y aromático, percibido como la dulzura general de la taza.","Clear, aromatic sweetness, perceived as the cup's overall sweetness.","Klare, aromatische Süße, wahrgenommen als die allgemeine Süße der Tasse."],"h":[{"id":"vainilla","n":["Vainilla","Vanilla","Vanille"],"d":["Cremosa, dulce y suave.","Creamy, sweet, and smooth.","Cremig, süß und weich."]},{"id":"vainillina","n":["Vainillina","Vanillin","Vanillin"],"d":["Dulce y ligeramente química, nota concentrada de vainilla.","Sweet and slightly synthetic, a concentrated vanilla note.","Süß und leicht chemisch, eine konzentrierte Vanillenote."]},{"id":"dulce-general","n":["Dulce general","Overall Sweet","Allgemein süß"],"d":["Percepción global de dulzor, sin nota específica.","An overall perception of sweetness, without a specific note.","Ein allgemeiner Süßeeindruck ohne spezifische Note."]},{"id":"aromatico-dulce","n":["Aromático dulce","Sweet Aromatic","Süßes Aroma"],"d":["Dulzor perfumado que envuelve el aroma completo.","A perfumed sweetness that wraps around the whole aroma.","Eine parfümierte Süße, die das gesamte Aroma umhüllt."]}]}]},

  extScaNota:["<b>El protocolo SCA de 2004 no tiene parte extrínseca.</b> Lo que llenas aquí es la ficha del lote —origen, proceso, comercio, certificaciones— con los mismos campos del formato extrínseco del CVA, para que la ficha salga completa.","<b>The 2004 SCA protocol has no extrinsic part.</b> What you fill in here is the lot record — origin, process, trade, certifications — using the same fields as the CVA extrinsic form, so the datasheet is complete.","<b>Das SCA-Protokoll von 2004 hat keinen extrinsischen Teil.</b> Hier füllen Sie die Stammdaten der Partie aus – Herkunft, Aufbereitung, Handel, Zertifizierungen – mit denselben Feldern wie das extrinsische CVA-Formular, damit das Datenblatt vollständig ist."],
  extCvaNota:["<b>Evaluación extrínseca (SCA 105):</b> se marca lo que se <b>sabe</b> del café. El cuadro verde junto a un campo es la casilla del formato oficial: se enciende cuando hay información. Para no sesgar la taza, llénala después de catar o que la llene otra persona.","<b>Extrinsic assessment (SCA 105):</b> you record what is <b>known</b> about the coffee. The green square next to a field is the box on the official form: it lights up when there is information. To avoid biasing the cup, fill it in after cupping or have someone else do it.","<b>Extrinsische Bewertung (SCA 105):</b> Sie erfassen, was über den Kaffee <b>bekannt</b> ist. Das grüne Quadrat neben einem Feld ist das Kästchen des offiziellen Formulars: Es leuchtet, wenn Information vorliegt. Um die Tasse nicht zu beeinflussen, füllen Sie es nach dem Cupping aus oder lassen Sie es jemand anderen tun."],
