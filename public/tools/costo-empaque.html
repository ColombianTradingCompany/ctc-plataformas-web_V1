<style>
:root{
  --purple:#3C0A86; --purple-deep:#26014F; --lavender:#D3B8FA; --lavender-soft:#EFE7FD;
  --yellow:#FFCD00; --blue:#003087; --red:#C8102E;
  --paper:#FFFFFF; --ash:#F6F3FB; --ink:#1B0F2E; --muted:#6D6386; --line:#E2DAF0; --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ash);color:var(--ink);font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(16px,3vw,32px)}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.logo{height:clamp(32px,5vw,42px);width:auto;display:block}
.topbar-right{display:flex;align-items:center;gap:10px}
.version{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--muted);
  border:1px solid var(--line);border-radius:100px;padding:5px 11px;background:var(--paper)}
.lang{display:flex;border:1px solid var(--purple);border-radius:100px;overflow:hidden;background:var(--paper)}
.lang button{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;font-weight:600;
  border:0;background:transparent;color:var(--purple);padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--purple);color:#fff}

/* hero readout */
.readout{background:var(--purple);color:#fff;border-radius:var(--r);padding:clamp(18px,3vw,26px);margin-bottom:22px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--lavender);margin:0 0 8px}
.readout-grid{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:clamp(18px,4vw,38px);align-items:start}
@media (max-width:760px){.readout-grid{grid-template-columns:1fr;gap:20px}}
.total{display:flex;align-items:baseline;gap:8px}
.total-value{font-family:"Anton",Impact,sans-serif;font-size:clamp(46px,9vw,68px);line-height:.92;letter-spacing:.01em}
.total-unit{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--lavender)}
.total-note{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--lavender);margin:8px 0 0}
.bar{display:flex;height:22px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.15)}
.sg{height:100%;transition:width .25s ease}
.sg-bag{background:var(--yellow)} .sg-labor{background:var(--red)} .sg-machine{background:var(--blue)}
.brk{display:grid;grid-template-columns:11px 1fr auto auto;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,.16)}
.brk:first-of-type{border-top:1px solid rgba(255,255,255,.16);margin-top:14px}
.sw{width:11px;height:11px;border-radius:2px}
.brk-name{font-size:13px}
.brk-share{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--lavender);width:40px;text-align:right}
.brk-val{font-family:"IBM Plex Mono",monospace;font-size:15px;text-align:right;min-width:78px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px 16px;margin-top:16px}
.stat-k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lavender);display:block}
.stat-v{font-family:"IBM Plex Mono",monospace;font-size:14px}
.pdf-btn{margin-top:18px;border:0;border-radius:var(--r);background:var(--yellow);color:var(--purple-deep);
  font-family:"Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:15px;
  padding:12px 22px;cursor:pointer}
.pdf-btn:hover{filter:brightness(1.07)}
/* Descargar el propio archivo: secundario, no compite con el PDF. */
.code-btn{margin-top:10px;display:block;border:1px solid rgba(255,255,255,.35);border-radius:var(--r);
  background:transparent;color:#fff;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  padding:8px 14px;cursor:pointer}
.code-btn:hover{border-color:#fff;background:rgba(255,255,255,.08)}

/* accordions */
details.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.block[open]{border-color:var(--lavender)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 18px;user-select:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--lavender-soft)}
.tick{width:8px;height:26px;border-radius:2px;flex:none;background:var(--purple)}
.tick-bag{background:var(--yellow)} .tick-labor{background:var(--red)} .tick-machine{background:var(--blue)}
.tick-meta{background:var(--lavender)}
.sum-title{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;font-size:16px;letter-spacing:.03em;flex:1;color:var(--purple)}
.sum-value{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);text-align:right}
.chev{width:11px;height:11px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s;flex:none}
details[open] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.body{padding:4px 18px 20px;border-top:1px solid var(--line)}

.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 16px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field-label{font-size:13px;font-weight:600}
.field-hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.input-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.input-wrap:focus-within{border-color:var(--purple);box-shadow:0 0 0 3px rgba(60,10,134,.12)}
.affix{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);padding:0 9px;flex:none}
.input-wrap input{width:100%;min-width:0;background:transparent;border:0;color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:15px;padding:9px 10px 9px 0;text-align:right}
.input-wrap input:focus{outline:none}
.input-wrap input:disabled{color:var(--muted);cursor:not-allowed}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);
  color:var(--ink);font-family:"Archivo",sans-serif;font-size:14px;padding:9px 10px}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(60,10,134,.12)}
textarea{resize:vertical;min-height:72px;line-height:1.45}
.uid-row{display:flex;gap:8px;align-items:stretch}
.uid-row input{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.uid-btn{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);color:var(--purple);
  font-family:"IBM Plex Mono",monospace;font-size:15px;padding:0 12px;cursor:pointer;flex:none}
.uid-btn:hover{border-color:var(--purple);background:var(--lavender-soft)}
input[type=file]{width:100%;border:1px dashed var(--line);border-radius:var(--r);background:var(--paper);
  color:var(--muted);font-family:"Archivo",sans-serif;font-size:13px;padding:10px}
input[type=file]::file-selector-button{border:0;border-radius:100px;background:var(--purple);color:#fff;
  font-family:"Archivo",sans-serif;font-size:12px;font-weight:600;padding:6px 14px;margin-right:10px;cursor:pointer}
.photo-prev{margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.photo-prev[hidden]{display:none}
.photo-prev img{max-height:120px;max-width:60%;border-radius:var(--r);border:1px solid var(--line);display:block}
.photo-del{border:1px solid var(--line);background:var(--paper);border-radius:100px;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;font-size:11px;padding:5px 12px;cursor:pointer;flex:none}
.photo-del:hover{border-color:var(--red);color:var(--red)}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.check input{accent-color:var(--purple);width:15px;height:15px}
.seg-ctrl{display:inline-flex;border:1px solid var(--line);border-radius:100px;padding:3px;background:var(--ash);gap:3px}
.seg-ctrl button{border:0;background:transparent;border-radius:100px;padding:7px 14px;cursor:pointer;
  font-family:"Archivo",sans-serif;font-size:13px;font-weight:600;color:var(--muted)}
.seg-ctrl button[aria-pressed="true"]{background:var(--purple);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:4px 11px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.chip:hover{border-color:var(--purple);color:var(--purple)}
.chip[aria-pressed="true"]{background:var(--purple);color:#fff;border-color:var(--purple)}

/* silhouette */
.viz{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;
  background:var(--lavender-soft);border-radius:var(--r);padding:14px 16px;margin-top:14px}
@media (max-width:520px){.viz{grid-template-columns:1fr}}
.viz svg{width:100%;height:118px;display:block;overflow:visible}
/* La planta de la cámara lleva cotas y rótulos: necesita más ancho que el
   dibujo de la bolsa para que el texto se lea. */
.viz-plan{grid-template-columns:300px 1fr}
.viz-plan svg{height:185px}
@media (max-width:520px){.viz-plan{grid-template-columns:1fr}}
.viz-read{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);line-height:1.7}
.viz-read b{color:var(--purple);font-size:17px;font-weight:600}
/* El peso por bolsa vive DENTRO del recuadro de la bolsa: es el resultado que
   se lee y, a la vez, el campo por el que se entra al revés (escribirlo deriva
   el llenado). Por eso va aquí y no abajo con los precios. */
.viz-field{display:block;margin-top:12px;padding-top:11px;border-top:1px solid rgba(60,10,134,.16);max-width:230px}
.viz-field-k{display:block;font-family:"Archivo",sans-serif;font-size:11.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;color:var(--purple);margin-bottom:5px}
.viz-field .input-wrap{background:#fff}
.viz-field input{font-size:16px;font-weight:600;color:var(--purple)}
.warn{margin-top:12px;padding:10px 12px;border-left:3px solid var(--yellow);background:#FFF9E0;
  font-size:12.5px;line-height:1.5;border-radius:0 var(--r) var(--r) 0}
.warn:empty{display:none}

/* market database */
.db{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.db-top{background:var(--lavender-soft);padding:12px 14px;border-bottom:1px solid var(--line)}
.db-title{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;font-size:13px;color:var(--purple);letter-spacing:.04em}
.db-sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:3px}
.db-filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;border-bottom:1px solid var(--line)}
.db-filters .field{flex:1;min-width:130px}
.db-list{max-height:460px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.db-card{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.db-card.picked{border-color:var(--purple);box-shadow:0 0 0 2px rgba(60,10,134,.1)}
.db-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.db-name{font-weight:700;font-size:14px}
.db-name span{color:var(--muted);font-weight:500}
.db-price{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--purple);font-weight:600;white-space:nowrap}
.db-price.q{color:var(--muted);font-size:12px;font-weight:400}
.db-spec{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.db-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.db-foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.db-where{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);flex:1;min-width:120px}
.db-link{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--purple);text-decoration:none;
  border:1px solid var(--line);border-radius:100px;padding:4px 10px}
.db-link:hover{border-color:var(--purple)}
.db-use{border:0;border-radius:100px;background:var(--purple);color:#fff;font-family:"Archivo",sans-serif;
  font-size:12px;font-weight:600;padding:6px 14px;cursor:pointer}
.db-use:hover{filter:brightness(1.15)}
.db-use[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 7px;border-radius:100px;background:var(--lavender-soft);color:var(--purple);margin-left:6px}
.badge.buc{background:#E0F0E6;color:#0B6B33}
.badge.q{background:#FFF3CC;color:#7A5B00}

footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sg,.chev{transition:none}}

/* print */
.sheet{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{display:none}
  .sheet{display:block}
}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2.5pt solid var(--purple);padding-bottom:8pt}
.sheet-head img{height:34pt}
.sheet-h1{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;color:var(--purple);font-size:19pt;line-height:1;margin:0;text-align:right;max-width:22ch}
.sheet-sub{font-family:"IBM Plex Mono",monospace;font-size:8pt;color:var(--muted);margin:4pt 0 0;text-align:right}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8pt;margin:10pt 0 0}
.meta-k{font-family:"IBM Plex Mono",monospace;font-size:6.5pt;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta-v{font-size:10pt;font-weight:600;border-bottom:.5pt solid var(--line);padding-bottom:3pt}
.sheet-hero{display:grid;grid-template-columns:auto 1fr;gap:18pt;align-items:center;background:var(--lavender-soft);border-radius:4pt;padding:12pt 14pt;margin:12pt 0}
.hero-num{font-family:"Anton",Impact,sans-serif;font-size:34pt;color:var(--purple);line-height:.9}
.hero-unit{font-family:"IBM Plex Mono",monospace;font-size:8pt;color:var(--muted)}
.sheet-bar{display:flex;height:13pt;border-radius:2pt;overflow:hidden;margin-bottom:6pt}
.sheet-legend{display:flex;gap:14pt;font-family:"IBM Plex Mono",monospace;font-size:8pt}
.sheet-legend span i{display:inline-block;width:7pt;height:7pt;border-radius:1.5pt;margin-right:4pt}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16pt;margin-top:4pt}
.sheet h2{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;font-size:10pt;color:var(--purple);
  margin:0 0 5pt;border-bottom:.75pt solid var(--purple);padding-bottom:3pt;letter-spacing:.03em}
.sheet table{width:100%;border-collapse:collapse;font-size:8.5pt}
.sheet td{padding:3pt 0;border-bottom:.4pt solid var(--line);vertical-align:top}
/* El rótulo lleva ancho fijo: sin esto, un valor largo (la máquina y la bolsa
   elegidas, con proveedor) empujaba la columna y TODOS los rótulos se partían
   en dos líneas — la ficha de una página se iba a dos. */
.sheet td:first-child{width:44%}
.sheet td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.sheet tr.pick td:last-child{white-space:normal}
.sheet .strong td{font-weight:700;border-bottom:1pt solid var(--purple)}
.notes{margin-top:10pt;border:.75pt solid var(--line);border-radius:3pt;padding:9pt;min-height:40pt}
.notes p{margin:0;font-size:9pt;white-space:pre-wrap}
.sheet-foot{margin-top:10pt;padding-top:6pt;border-top:.75pt solid var(--line);display:flex;justify-content:space-between;
  font-family:"IBM Plex Mono",monospace;font-size:7pt;color:var(--muted)}
.sheet-viz{display:flex;gap:10pt;align-items:center;margin-top:6pt}
.sheet-viz svg{height:60pt;width:auto}
.sheet-viz svg#pVizChamber{height:88pt}   /* lleva cotas: a 60pt no se leían */
.sheet-photo{display:none;margin-top:8pt}
.sheet-photo img{max-width:100%;max-height:118pt;border-radius:3pt;border:.5pt solid var(--line);display:block}
</style>
</head>

  <!-- ============ READOUT (primero) ============ -->

    <div class="readout-grid">
      <div>
        <div class="total">
          <span class="total-value" id="totalKg">—</span>
          <span class="total-unit">COP / kg</span>
        </div>

        <button class="code-btn" type="button" id="codeBtn" data-i18n="getCode"></button>
      </div>
      <div>
        <div class="bar" role="img" aria-label="split">

          <span class="brk-name" data-i18n="cBag"></span>
          <span class="brk-share" id="shareBag">—</span><span class="brk-val" id="valBag">—</span></div>

          <span class="brk-name" data-i18n="cLabor"></span>
          <span class="brk-share" id="shareLabor">—</span><span class="brk-val" id="valLabor">—</span></div>
        <div class="brk"><span class="sw" style="background:var(--blue)"></span>
          <span class="brk-name" data-i18n="cMachine"></span>
          <span class="brk-share" id="shareMachine">—</span><span class="brk-val" id="valMachine">—</span></div>
        <div class="stats">
          <div><span class="stat-k" data-i18n="kCycle"></span><span class="stat-v" id="kgCycle">—</span></div>
          <div><span class="stat-k" data-i18n="kHour"></span><span class="stat-v" id="kgHour">—</span></div>
          <div><span class="stat-k" data-i18n="kDay"></span><span class="stat-v" id="kgDay">—</span></div>
          <div><span class="stat-k" data-i18n="kLife"></span><span class="stat-v" id="kgLife">—</span></div>
          <div><span class="stat-k" data-i18n="kCostDay"></span><span class="stat-v" id="costDay">—</span></div>
          <div><span class="stat-k" data-i18n="kCostBag"></span><span class="stat-v" id="costBag">—</span></div>
        </div>
      </div>

  <!-- ============ 1 · DATOS ============ -->
  <details class="block">
    <summary><span class="tick tick-meta"></span><span class="sum-title" data-i18n="s5"></span>
      <span class="sum-value" id="sum5"></span><span class="chev"></span></summary>
    <div class="body">
      <div class="rows">
        <label class="field"><span class="field-label" data-i18n="mName"></span><input type="text" id="mName"></label>
        <label class="field"><span class="field-label" data-i18n="mVendor"></span><input type="text" id="mVendor"></label>
        <label class="field"><span class="field-label" data-i18n="mRef"></span>
          <span class="uid-row">
            <input type="text" id="mRef">
            <button class="uid-btn" type="button" id="uidBtn" title="Regenerar / Regenerate">&#8635;</button>
          </span>
          <span class="field-hint" data-i18n="mRefHint"></span></label>
        <label class="field"><span class="field-label" data-i18n="mDate"></span>
          <input type="date" id="mDate">
          <span class="field-hint" data-i18n="mDateHint"></span></label>
      </div>
      <div class="rows" style="margin-top:14px;grid-template-columns:1fr 1fr">
        <div class="field">
          <span class="field-label" data-i18n="mNotes"></span>
          <textarea id="mNotes"></textarea>
          <span class="field-hint" data-i18n="mNotesHint"></span>
        </div>
        <div class="field">
          <span class="field-label" data-i18n="mPhoto"></span>
          <input type="file" id="mPhotoIn" accept="image/*">
          <span class="field-hint" data-i18n="mPhotoHint"></span>
          <div class="photo-prev" id="photoPrev" hidden>
            <img id="photoImg" alt="">
            <button class="photo-del" type="button" id="photoDel" data-i18n="photoDel"></button>
          </div>
        </div>
      </div>
    </div>
  </details>

  <!-- ============ 2 · INVERSION + BASE DE DATOS ============ -->
  <details class="block">
    <summary><span class="tick"></span><span class="sum-title" data-i18n="s4"></span>
      <span class="sum-value" id="sum4"></span><span class="chev"></span></summary>
    <div class="body">
      <div class="rows">
        <label class="field"><span class="field-label" data-i18n="price"></span>
          <span class="input-wrap"><span class="affix">$</span><input type="number" id="price" min="0" step="10000"></span>
          <span class="field-hint" data-i18n="priceHint"></span></label>
        <label class="field"><span class="field-label" data-i18n="days"></span>
          <span class="input-wrap"><input type="number" id="days" min="1" step="10"><span class="affix" data-i18n="daysUnit"></span></span>
          <span class="field-hint"><span id="yearsOut">—</span></span></label>
        <label class="field"><span class="field-label" data-i18n="dpw"></span>
          <span class="input-wrap"><input type="number" id="daysPerWeek" min="0.5" max="7" step="0.5"><span class="affix">d/sem</span></span>
          <span class="field-hint" data-i18n="dpwHint"></span></label>
      </div>

      <div class="db">
        <div class="db-top">
          <div class="db-title" data-i18n="dbTitle"></div>
          <div class="db-sub" data-i18n="dbSub"></div>
        </div>
        <div class="db-filters">
          <label class="field"><span class="field-label" data-i18n="dbCity"></span>
            <select id="fCityM"></select></label>
          <label class="field"><span class="field-label" data-i18n="dbBrand"></span>
            <select id="fBrandM"></select></label>
        </div>
        <div class="db-list" id="dbListM"></div>
      </div>
    </div>
  </details>

      </div>

      <div class="rows">
        <div class="field"><span class="field-label" data-i18n="bar"></span>
          <span class="input-wrap"><input type="number" id="bar" min="1" step="1"><span class="affix">cm</span></span>

/* ---- reference UID: CTC_vacuumsealer-########-ddmmyy, random on every load ---- */
function newUID(){
  let r;
  if(window.crypto && window.crypto.getRandomValues){
    const a = new Uint32Array(1); crypto.getRandomValues(a); r = a[0] % 100000000;
  } else { r = Math.floor(Math.random()*100000000); }
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `CTC_vacuumsealer-${String(r).padStart(8,'0')}-${p(d.getDate())}${p(d.getMonth()+1)}${String(d.getFullYear()).slice(-2)}`;
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(lang==='es'?'es-CO':'en-GB',{year:'numeric',month:'long',day:'numeric'});
}
/* ---- photo: downscaled to keep the file light and the PDF fast ---- */
function loadPhoto(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1400, sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      photoData = c.toDataURL('image/jpeg',0.82);
      $('photoImg').src = photoData; $('photoPrev').hidden = false;
      $('pPhoto').src = photoData; $('pPhotoWrap').style.display = 'block';
      calc();
    };
    img.onerror = () => { photoData = null; $('photoPrev').hidden = true; };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function clearPhoto(){
  photoData = null; $('mPhotoIn').value = '';
  $('photoPrev').hidden = true; $('pPhotoWrap').style.display = 'none';
  $('photoImg').removeAttribute('src'); $('pPhoto').removeAttribute('src');
  calc();
}

function iso(x,y,z){ return [(x-z)*0.866, (x+z)*0.5 - y]; }
function boxPolys(x0,y0,z0,w,h,d){
  const P=(x,y,z)=>iso(x0+x, y0+y, z0+z);
  return {top:[P(0,h,0),P(w,h,0),P(w,h,d),P(0,h,d)],
          front:[P(0,0,d),P(w,0,d),P(w,h,d),P(0,h,d)],
          side:[P(w,0,0),P(w,0,d),P(w,h,d),P(w,h,0)]};
}
const poly = (pts,fill,stroke,extra='') =>
  `<polygon points="${pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="1.1" stroke-linejoin="round" ${extra}/>`;
function fit(svg, pts, pad=8){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  svg.setAttribute('viewBox', `${Math.min(...xs)-pad} ${Math.min(...ys)-pad} ${Math.max(...xs)-Math.min(...xs)+pad*2} ${Math.max(...ys)-Math.min(...ys)+pad*2}`);
}
function drawBag(svg,W,L,D,type){
  if(!svg) return;
  const th = type==='block' ? D : Math.max(W*0.20,2);
  const f = boxPolys(0,0,0,W,L,th);
  let html = poly(f.front,'#FFCD00','#3C0A86') + poly(f.side,'#E0B400','#3C0A86') + poly(f.top,'#FFE47A','#3C0A86');
  if(type!=='block'){
    html += poly([iso(0,L,th),iso(W,L,th),iso(W,L*0.93,th),iso(0,L*0.93,th)],'#3C0A86','#3C0A86')
          + poly([iso(0,L*0.07,th),iso(W,L*0.07,th),iso(W,0,th),iso(0,0,th)],'#3C0A86','#3C0A86');
  }
  svg.innerHTML = html;
  fit(svg,[...f.top,...f.front,...f.side]);
}
/* Vista EN PLANTA de la cámara: se mira hacia abajo, con la barra de sellado al
   frente y las bolsas acostadas contra ella. Sustituye al isométrico de la v3.1,
   que era ilegible y —peor— MENTÍA: dibujaba su propia fila de bolsas y paraba
   en cuanto una no cabía, así que al elegir una máquina de barra corta el rótulo
   decía "2 bolsas / ciclo" sobre una cámara vacía. Aquí el dibujo sale de los
   mismos números que el rótulo, y lo que no cabe se dibuja como lo que es.
   `perChamber` = las que caben por geometría; `drawn` = las que se van a empacar
   por cámara (puede ser mayor si el usuario fijó las bolsas por ciclo a mano). */
function drawPlan(svg,bar,depth,W,L,perChamber,drawn,chambers){
  if(!svg) return;
  bar = Math.max(bar,1); depth = Math.max(depth,1); W = Math.max(W,0.1); L = Math.max(L,0.1);
  const fs = Math.max(bar,depth)*0.082;
  const SEAL = Math.max(depth*0.07,1.6);          // franja roja de la barra
  const usable = Math.max(depth-SEAL,0.5);        // fondo libre para la bolsa
  const over = Math.max(L-usable,0);              // cuánto sobresale la bolsa
  const fits = Math.max(perChamber,0);
  const spare = Math.max(bar-fits*W,0);
  const gap = fits>1 ? Math.min(1.2, spare/(fits-1)) : 0;
  const yBar = depth-SEAL;                        // borde donde apoya la boca
  const esc = lang==='es';
  const T_ = (s,o) => Object.keys(o||{}).reduce((a,k)=>a.split('{'+k+'}').join(o[k]), t(s));
  const txt = (x,y,s,fill,anchor='middle',extra='') =>
    `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${fs.toFixed(2)}" fill="${fill}"
      text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" ${extra}>${s}</text>`;
  const rect = (x,y,w,h,fill,stroke,extra='') =>
    `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${Math.max(w,0).toFixed(2)}" height="${Math.max(h,0).toFixed(2)}"
      fill="${fill}" stroke="${stroke}" stroke-width="${(fs*0.11).toFixed(2)}" stroke-linejoin="round" ${extra}/>`;

  let html = '';
  // cámara + barra de sellado
  html += rect(0,0,bar,depth,'rgba(211,184,250,.30)','#3C0A86','stroke-dasharray="'+(fs*0.5).toFixed(2)+' '+(fs*0.4).toFixed(2)+'"');
  html += rect(0,yBar,bar,SEAL,'#C8102E','#8E0B20');

  // las bolsas que sí caben
  for(let i=0;i<fits;i++){
    const x = i*(W+gap);
    html += rect(x,yBar-Math.min(L,usable),W,Math.min(L,usable),'#FFCD00','#3C0A86');
    if(over>0) html += rect(x,yBar-L,W,over,'none','#C8102E','stroke-dasharray="'+(fs*0.4).toFixed(2)+' '+(fs*0.35).toFixed(2)+'"');
  }
  // el sobrante de barra que no alcanza para otra bolsa
  if(spare>W*0.06 && fits>0)
    html += rect(fits*W+gap*Math.max(fits-1,0),yBar-Math.min(L,usable)*0.34,spare-gap*Math.max(fits-1,0),Math.min(L,usable)*0.34,
                 'rgba(60,10,134,.07)','rgba(60,10,134,.35)','stroke-dasharray="'+(fs*0.3).toFixed(2)+' '+(fs*0.3).toFixed(2)+'"');

  // las que NO caben: se dibujan fuera, en rojo punteado, en vez de desaparecer
  const extra = Math.max(drawn-fits,0);
  let extraW = 0;
  for(let i=0;i<Math.min(extra,4);i++){
    const x = bar+fs*0.9+i*(W*0.5);
    extraW = x+W*0.5-bar;
    html += rect(x,yBar-Math.min(L,usable)*0.7,W*0.5,Math.min(L,usable)*0.7,'rgba(200,16,46,.10)','#C8102E',
                 'stroke-dasharray="'+(fs*0.4).toFixed(2)+' '+(fs*0.35).toFixed(2)+'"');
  }

  // cotas y avisos (el sobrante se dice en la cota de abajo, no encima de las
  // bolsas: ahí se montaba sobre el dibujo y no se leía ninguno de los dos)
  html += txt(bar/2, depth+fs*1.6,
              dec(bar,0)+' cm'
              + (spare>W*0.06&&fits>0 ? ' · '+T_('planSpare',{c:dec(spare,0)}) : '')
              + (chambers>1 ? ' · '+T_('planChambers',{n:chambers}) : ''), '#6D6386');
  html += txt(0,0, dec(depth,0)+' cm', '#6D6386', 'middle',
              `transform="rotate(-90 ${(-fs*1.1).toFixed(2)} ${(depth/2).toFixed(2)})" x="${(-fs*1.1).toFixed(2)}" y="${(depth/2+fs*0.35).toFixed(2)}"`);
  if(fits===0) html += txt(bar/2, yBar-usable*0.45, esc?'no cabe ninguna':'none fits', '#C8102E');
  if(over>0 && fits>0) html += txt(bar/2, yBar-L-fs*0.5, T_('planLong',{c:dec(over,0)}), '#C8102E');
  if(extra>0) html += txt(bar+fs*0.9, yBar+fs*1.7, T_('planOver',{n:extra*Math.max(chambers,1)}), '#C8102E', 'start');

  const padL = fs*2.6, padR = fs*0.8+extraW, padT = fs*1.6+Math.max(over,0), padB = fs*2.6;
  svg.innerHTML = html;
  svg.setAttribute('viewBox',
    `${(-padL).toFixed(2)} ${(-padT).toFixed(2)} ${(bar+padL+padR).toFixed(2)} ${(depth+padT+padB).toFixed(2)}`);
}

/* ============ market database ============ */
/* Dos listas independientes: las máquinas viven junto a la inversión y las
   bolsas DENTRO de la sección Bolsa, al lado de los campos que rellenan. */
const DB = {mach:{data:MACHINES, list:'dbListM', city:'fCityM', brand:'fBrandM', card:machCard},
            bag: {data:BAGS,     list:'dbListB', city:'fCityB', brand:'fBrandB', card:bagCard}};

function fillFilters(kind){
  const d = DB[kind];
  const cities = [...new Set(d.data.flatMap(x=>x.cities))].filter(c=>c!=='—');
  const brands = [...new Set(d.data.map(x=>x.brand))];
  $(d.city).innerHTML = `<option value="">${t('dbAll')}</option>` + cities.map(c=>`<option>${c}</option>`).join('');
  $(d.brand).innerHTML = `<option value="">${t('dbAll')}</option>` + brands.map(b=>`<option>${b}</option>`).join('');
}

function renderDB(kind){
  const d = DB[kind];
  const city = $(d.city).value, brand = $(d.brand).value;
  const list = d.data.filter(x =>
    (!city || x.cities.includes(city)) && (!brand || x.brand===brand));
  if(!list.length){ $(d.list).innerHTML = `<p class="db-note">${t('dbEmpty')}</p>`; return; }
  $(d.list).innerHTML = list.map(x => d.card(x)).join('');
  $(d.list).querySelectorAll('[data-use]').forEach(b =>
    b.addEventListener('click', () => useEntry(b.dataset.use)));
}
function renderAllDB(){ fillFiltersKeep('mach'); fillFiltersKeep('bag'); }
function fillFiltersKeep(kind){
  const d = DB[kind], city = $(d.city).value, brand = $(d.brand).value;
  fillFilters(kind); $(d.city).value = city; $(d.brand).value = brand; renderDB(kind);
}

function priceTag(x){
  if(!x.price) return `<span class="db-price q">${t('dbNoPrice')}</span>`;
  return `<span class="db-price">${money(x.price)}${x.priceIVA?` <span class="badge">${t('dbIVA')}</span>`:''}</span>`;
}
function whereTag(x){
  return x.cities.map(c => c==='Bucaramanga'
    ? `<span class="badge buc">${c}</span>` : (c==='—'?'':`<span class="badge">${c}</span>`)).join('');
}
function machCard(x){
  const spec = [
    x.bar ? `${t('lbBar')} ${x.bar} cm${x.barApprox?' ~':''}` : `${t('dbBarUnknown')}`,
    x.chambers>1 ? `${x.chambers} ${t('lbChambers').toLowerCase()}` : null,
    x.chamberD ? `${t('lbChamber')} ${x.chamberD} cm` : null,
    x.pump ? `${t('lbPump')} ${x.pump} m³/h` : null,
    x.volt
  ].filter(Boolean).join(' · ');
  return `<div class="db-card ${picked.mach===x.id?'picked':''}">
    <div class="db-head"><span class="db-name">${x.brand} <span>${x.model}</span></span>${priceTag(x)}</div>
    <div class="db-spec">${spec}</div>
    <div class="db-note">${x.note[lang]}</div>
    <div class="db-foot">
      <span class="db-where">${x.vendor} ${whereTag(x)}</span>
      ${x.url?`<a class="db-link" href="${x.url}" target="_blank" rel="noopener">${t('dbSheet')}</a>`:''}
      <button class="db-use" type="button" data-use="${x.id}">${picked.mach===x.id?t('dbPicked'):t('dbUse')}</button>
    </div></div>`;
}
function bagCard(x){
  const dims = x.w ? (x.d ? `${x.w}×${x.l}×${x.d} cm` : `${x.w}×${x.l} cm`) : '—';
  const spec = [`${t('lbDims')} ${dims}`, x.type==='block'?t('vBlock'):t('vPillow')].join(' · ');
  const can = x.w || (x.price && x.usePrice);
  return `<div class="db-card ${picked.bag===x.id?'picked':''}">
    <div class="db-head"><span class="db-name">${x.brand} <span>${x.model}</span></span>${priceTag(x)}</div>
    <div class="db-spec">${spec}</div>
    <div class="db-note">${x.note[lang]}</div>
    <div class="db-foot">
      <span class="db-where">${x.vendor} ${whereTag(x)}</span>
      ${x.url?`<a class="db-link" href="${x.url}" target="_blank" rel="noopener">${t('dbSheet')}</a>`:''}
      <button class="db-use" type="button" data-use="${x.id}" ${can?'':'disabled'}>${picked.bag===x.id?t('dbPicked'):t('dbUse')}</button>
    </div></div>`;
}

/* Elegir de la lista RELLENA los campos, nada más: todos siguen siendo
   editables y escribir encima manda. Ya no se activa solo el "fijar a mano" de
   las bolsas por ciclo — las cámaras son ahora un campo propio, así que la
   geometría sigue viva y el dibujo no puede contradecir al número. */
function useEntry(id){
  const m = MACHINES.find(x=>x.id===id);
  if(m){
    picked.mach = id;
    picked.machLabel = `${m.brand} ${m.model}`;
    picked.machVendor = m.vendor;
    if(m.price) $('price').value = m.price;
    if(m.bar) $('bar').value = m.bar;
    if(m.chamberD) $('chamberD').value = m.chamberD;
    $('chambers').value = Math.max(1, m.chambers || 1);
    if(!$('mVendor').value) $('mVendor').value = m.vendor;
  } else {
    const b = BAGS.find(x=>x.id===id);
    if(!b) return;
    picked.bag = id;
    picked.bagLabel = `${b.brand} ${b.model}`;
    picked.bagVendor = b.vendor;
    if(b.type){ bagType = b.type;
      document.querySelectorAll('[data-bagtype]').forEach(x =>
        x.setAttribute('aria-pressed', x.dataset.bagtype===bagType?'true':'false')); }
    if(b.w) $('bagW').value = b.w;
    if(b.l) $('bagL').value = b.l;
    if(b.d!=null) $('bagD').value = b.d;
    if(b.price && b.usePrice) $('bagNet').value = b.price;
    // La bolsa elegida manda sobre su propia geometría: el peso vuelve a salir
    // del llenado (si el usuario quiere otro peso, lo escribe otra vez).
    weightDriven = false;
  }
  renderDB('mach'); renderDB('bag'); calc();
}

/* ============ calculation ============ */
function calc(){
  const v = {};
  NUMS.forEach(k => v[k] = parseFloat($(k).value) || 0);

  const useLen = Math.max(v.bagL - v.seal, 0);
  const volL = bagType==='block' ? (v.bagW*v.bagD*useLen)/1000 : (v.bagW*v.bagW*useLen/Math.PI)/1000;
  const capMax = volL * v.dens;                    // llena al 100 %

  /* Peso ⇄ llenado. Si el usuario escribió el peso, el llenado se deriva de él
     (y se avisa cuando pide más de lo que cabe); si no, el peso sale del
     llenado. Nunca se pisa el campo que se está escribiendo. */
  let fillPct = v.fill, overMsg = '';
  if(weightDriven && capMax>0){
    const raw = v.kgBag/capMax*100;
    fillPct = Math.min(100, Math.max(0, raw));
    if(raw > 100.5) overMsg = t('overFill').split('{k}').join(dec(v.kgBag,1)).split('{m}').join(dec(capMax,1));
    $('fill').value = Math.round(fillPct*10)/10;
  }
  const kgPerBag = capMax * (fillPct/100);
  if(document.activeElement !== $('kgBag')) $('kgBag').value = kgPerBag ? kgPerBag.toFixed(1) : '';
  $('bagWarn').textContent = overMsg;

  const chambers = Math.max(Math.round(v.chambers)||1, 1);
  const perChamber = v.bagW>0 ? Math.floor(v.bar/v.bagW) : 0;   // por geometría
  const bpcAuto = perChamber * chambers;
  const bpc = $('bagsManualOn').checked ? Math.round(v.bagsManual) : bpcAuto;
  const drawnPerChamber = Math.max(Math.ceil(bpc/chambers), 0); // lo que el número promete

  const kgPerCycle = bpc*kgPerBag;
  const kgPerHour = v.cycleMin>0 ? kgPerCycle*(60/v.cycleMin) : 0;
  const kgPerDay = kgPerHour*v.hours;
  const kgLife = kgPerDay*v.days;

  const bagGross = v.bagNet*(1+v.iva/100);
  const cBag = kgPerBag>0 ? bagGross/kgPerBag : 0;
  const cLabor = kgPerDay>0 ? (v.wage*v.people)/kgPerDay : 0;
  const cMachine = kgLife>0 ? v.price/kgLife : 0;
  const total = cBag+cLabor+cMachine;

  $('volOut').textContent = dec(volL,1);
  $('capOut').textContent = dec(capMax,1);
  $('bagGross').textContent = money(bagGross);
  $('gussetField').style.display = bagType==='block' ? '' : 'none';
  drawBag($('vizBag'), v.bagW, v.bagL, v.bagD, bagType);
  drawBag($('pVizBag'), v.bagW, v.bagL, v.bagD, bagType);

  if(!$('bagsManualOn').checked) $('bagsManual').value = bpcAuto;
  $('bpcOut').textContent = bpc;
  $('kgcOut').textContent = dec(kgPerCycle,1);
  drawPlan($('vizChamber'), v.bar, v.chamberD, v.bagW, v.bagL, perChamber, drawnPerChamber, chambers);
  drawPlan($('pVizChamber'), v.bar, v.chamberD, v.bagW, v.bagL, perChamber, drawnPerChamber, chambers);

  let warn = '';
  if(perChamber<1) warn = t('noBags').replace('{W}',dec(v.bagW,0)).replace('{B}',dec(v.bar,0));
  else if(v.bagL>v.chamberD) warn = t('noFit').replace('{L}',dec(v.bagL,0)).replace('{C}',dec(v.chamberD,0));
  $('fitWarn').textContent = warn;

  $('yearsOut').textContent = v.daysPerWeek>0 ? '≈ '+dec(v.days/(v.daysPerWeek*52),1)+(lang==='es'?' años':' years') : '—';

  $('sum1').textContent = dec(kgPerBag,1)+' kg · '+money(bagGross);
  $('sum2').textContent = bpc+' × '+dec(v.cycleMin,0)+' min';
  $('sum3').textContent = dec(v.hours,0)+' h · '+money(v.wage);
  $('sum4').textContent = money(v.price);
  $('sum5').textContent = $('mRef').value || $('mName').value || '';

  $('totalKg').textContent = total>0 ? F.format(Math.round(total)) : '—';
  $('perBag').textContent = kgPerBag>0
    ? t('perBagLine').replace('{a}',money(total*kgPerBag)).replace('{k}',dec(kgPerBag,1)) : t('fillMsg');

  [['Bag',cBag],['Labor',cLabor],['Machine',cMachine]].forEach(([n_,val])=>{
    const sh = total>0 ? val/total*100 : 0;
    $('seg'+n_).style.width = sh+'%';
    $('val'+n_).textContent = total>0 ? money(val) : '—';
    $('share'+n_).textContent = total>0 ? dec(sh,0)+'%' : '—';
    $('pSeg'+n_).style.width = sh+'%';
    $('pLeg'+n_).textContent = total>0 ? dec(sh,0)+'%' : '—';
  });

  $('kgCycle').textContent = dec(kgPerCycle,1)+' kg';
  $('kgHour').textContent = dec(kgPerHour,0)+' kg';
  $('kgDay').textContent = dec(kgPerDay,0)+' kg';
  $('kgLife').textContent = F.format(Math.round(kgLife))+' kg';
  $('costDay').textContent = money(total*kgPerDay);
  $('costBag').textContent = money(total*kgPerBag);

  const rows = arr => arr.map(r=>`<tr class="${r[2]||''}"><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  $('pCostTable').innerHTML = rows([
    [t('rowBag'),money(cBag)+' /kg'],[t('rowLabor'),money(cLabor)+' /kg'],
    [t('rowMachine'),money(cMachine)+' /kg'],[t('rowTotal'),money(total)+' /kg','strong']]);
  $('pOutTable').innerHTML = rows([
    [t('oCycle'),dec(kgPerCycle,1)+' kg'],[t('oHour'),dec(kgPerHour,0)+' kg'],
    [t('oDay'),dec(kgPerDay,0)+' kg'],[t('oLife'),F.format(Math.round(kgLife))+' kg'],
    [t('oCostDay'),money(total*kgPerDay)],[t('oCostBag'),money(total*kgPerBag)]]);
  const dims = bagType==='block' ? `${dec(v.bagW,0)} × ${dec(v.bagL,0)} × ${dec(v.bagD,0)} cm`
                                 : `${dec(v.bagW,0)} × ${dec(v.bagL,0)} cm`;
  /* La ficha nombra lo ELEGIDO en las dos listas (marca, modelo y proveedor):
     sin esto el PDF describía medidas y precios sin decir de qué bolsa ni de
     qué máquina se estaba hablando. */
  const pickLine = (label,vendor) => label + (vendor?` · ${vendor}`:'');
  $('pSpecTable').innerHTML = rows([
    ...(picked.machLabel ? [[t('spEquip'), pickLine(picked.machLabel,picked.machVendor),'pick']] : []),
    ...(picked.bagLabel ? [[t('spBagPick'), pickLine(picked.bagLabel,picked.bagVendor),'pick']] : []),
    [t('spBagType'), bagType==='block'?t('vBlock'):t('vPillow')],
    [t('spDim'),dims],[t('spVol'),dec(volL,1)+' L'],
    [t('spFill'),dec(fillPct,0)+' %'],[t('spCap'),dec(kgPerBag,1)+' kg'],
    [t('spBagPrice'),money(bagGross)],[t('spBar'),dec(v.bar,0)+' cm'],
    [t('spChamber'),dec(v.chamberD,0)+' cm'],
    ...(chambers>1 ? [[t('spChambers'),chambers]] : []),
    [t('spBpc'),bpc],
    [t('spCycle'),dec(v.cycleMin,1)+' min'],[t('spHours'),dec(v.hours,1)+' h'],
    [t('spWage'),money(v.wage)+' × '+dec(v.people,0)],[t('spPrice'),money(v.price)],
    [t('spLife'),F.format(v.days)+' '+t('daysUnit')]]);
  /* Lo que la herramienta acaba de calcular, para quien la embeba (el OCP la
     monta en un iframe y guarda esto como resultado de la cotización). Se
     PUBLICA lo ya calculado; nadie recalcula por su cuenta. */
  LAST.total = total; LAST.cBag = cBag; LAST.cLabor = cLabor; LAST.cMachine = cMachine;
  LAST.kgPerBag = kgPerBag; LAST.kgPerCycle = kgPerCycle; LAST.kgPerHour = kgPerHour;
  LAST.kgPerDay = kgPerDay; LAST.kgLife = kgLife; LAST.bpc = bpc; LAST.perChamber = perChamber;
  LAST.chambers = chambers; LAST.fillPct = fillPct; LAST.volL = volL; LAST.capMax = capMax;
  LAST.bagGross = bagGross; LAST.costDay = total*kgPerDay; LAST.costBag = total*kgPerBag;
  LAST.machinePrice = v.price; LAST.days = v.days; LAST.warn = warn || overMsg || '';

  $('pTotal').textContent = total>0 ? F.format(Math.round(total)) : '—';
  $('pName').textContent = $('mName').value || '—';
  $('pVendor').textContent = $('mVendor').value || '—';
  $('pRef').textContent = $('mRef').value || '—';
  $('pDate').textContent = fmtDate($('mDate').value);
  $('pNotes').textContent = $('mNotes').value || '—';
  $('pSub').textContent = warn ? '⚠ '+warn : t('footRight');
}

/* ============ language ============ */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.lang===lang?'true':'false'));
  const c = t('copy').replace('{y}', new Date().getFullYear());
  $('footCopy').textContent = c; $('pFootCopy').textContent = c;
  renderAllDB(); calc();
}

/* ============ wiring ============ */
/* kgBag y fill quedan FUERA de este bucle: son las dos puertas al mismo dato y
   necesitan fijar antes quién manda. Con el oyente genérico también enganchado,
   calc() corría primero sin saberlo, reescribía el campo recién tecleado y la
   segunda pasada ya leía el valor pisado (escribir 6 kg daba 99,7 % de llenado). */
NUMS.filter(k => k!=='kgBag' && k!=='fill').forEach(k => $(k).addEventListener('input', calc));
['mName','mVendor','mRef','mDate','mNotes'].forEach(k => $(k).addEventListener('input', calc));
/* Las dos puertas al mismo dato: la última que se toca es la que manda. */
$('kgBag').addEventListener('input', () => { weightDriven = true; calc(); });
$('fill').addEventListener('input', () => { weightDriven = false; calc(); });
$('bagsManualOn').addEventListener('change', e => { $('bagsManual').disabled = !e.target.checked; calc(); });
document.querySelectorAll('[data-bagtype]').forEach(b => b.addEventListener('click', () => {
  bagType = b.dataset.bagtype;
  document.querySelectorAll('[data-bagtype]').forEach(x => x.setAttribute('aria-pressed', x===b?'true':'false'));
  calc();
}));
document.querySelectorAll('[data-bar]').forEach(b => b.addEventListener('click', () => { $('bar').value = b.dataset.bar; calc(); }));
['fCityM','fBrandM'].forEach(k => $(k).addEventListener('change', () => renderDB('mach')));
['fCityB','fBrandB'].forEach(k => $(k).addEventListener('change', () => renderDB('bag')));
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));
$('uidBtn').addEventListener('click', () => { $('mRef').value = newUID(); calc(); });
$('mPhotoIn').addEventListener('change', e => loadPhoto(e.target.files && e.target.files[0]));
$('photoDel').addEventListener('click', clearPhoto);
$('pdfBtn').addEventListener('click', () => { calc(); window.print(); });
/* Descarga el ARCHIVO tal como está publicado, no el DOM ya manipulado: se pide
   la propia URL. Abierta como file:// el fetch puede estar bloqueado, y ahí sí
   se salva el documento actual, avisando de la diferencia. */
$('codeBtn').addEventListener('click', async () => {
  const name = (location.pathname.split('/').pop() || 'costo-empaque.html').replace(/\.html?$/,'') + '-v3.2.html';
  const save = (text, note) => {
    const url = URL.createObjectURL(new Blob([text], {type:'text/html;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    if(note) alert(note);
  };
  try{
    const r = await fetch(location.href, {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    save(await r.text());
  }catch(e){
    save('<!doctype html>\n' + document.documentElement.outerHTML, t('codeErr'));
  }
});
window.addEventListener('beforeprint', calc);

/* ============ puente para quien la embeba (OCP · Cotizadores) ============
   La herramienta sigue siendo autónoma: esto solo EXPONE lo que ya sabe. Hace
   falta porque su estado vive en `let` de ámbito de script (bagType, picked,
   weightDriven…), que no son propiedades de window y por tanto nadie de fuera
   puede leerlas ni restaurarlas leyendo los <input>. */
const META_KEYS = ['mName','mVendor','mRef','mDate','mNotes'];
window.CTC_TOOL = {
  id: 'costo-empaque',
  version: '3.2',
  getState(){
    const nums = {}; NUMS.forEach(k => nums[k] = $(k).value);
    const meta = {}; META_KEYS.forEach(k => meta[k] = $(k).value);
    return {
      tool:'costo-empaque', version:'3.2', lang, nums, meta, bagType, weightDriven,
      bagsManualOn: $('bagsManualOn').checked,
      picked: {...picked},
      photo: photoData || null,
    };
  },
  setState(s){
    if(!s || typeof s !== 'object') return false;
    if(s.nums) NUMS.forEach(k => { if(s.nums[k] !== undefined && s.nums[k] !== '') $(k).value = s.nums[k]; });
    if(s.meta) META_KEYS.forEach(k => { if(s.meta[k] !== undefined) $(k).value = s.meta[k]; });
    if(s.bagType){ bagType = s.bagType;
      document.querySelectorAll('[data-bagtype]').forEach(x =>
        x.setAttribute('aria-pressed', x.dataset.bagtype===bagType?'true':'false')); }
    if(typeof s.bagsManualOn === 'boolean'){ $('bagsManualOn').checked = s.bagsManualOn; $('bagsManual').disabled = !s.bagsManualOn; }
    if(s.picked) Object.assign(picked, s.picked);
    weightDriven = !!s.weightDriven;
    if(s.photo){ photoData = s.photo; $('photoImg').src = s.photo; $('photoPrev').hidden = false; }
    renderDB('mach'); renderDB('bag'); calc();
    return true;
  },
  /* Las cifras que el OCP guarda como resultado y compara entre configuraciones.
     Salen de calc(), no se recalculan aquí. */
  getHeadline(){
    calc();
    return {
      costoPorKilo: Math.round(LAST.total||0),
      costoBolsa: Math.round(LAST.cBag||0),
      costoManoObra: Math.round(LAST.cLabor||0),
      costoAmortizacion: Math.round(LAST.cMachine||0),
      costoPorBolsa: Math.round(LAST.costBag||0),
      costoPorDia: Math.round(LAST.costDay||0),
      kgPorBolsa: LAST.kgPerBag||0,
      kgPorCiclo: LAST.kgPerCycle||0,
      kgPorDia: LAST.kgPerDay||0,
      kgVidaUtil: LAST.kgLife||0,
      bolsasPorCiclo: LAST.bpc||0,
      llenadoPct: LAST.fillPct||0,
      precioMaquina: LAST.machinePrice||0,
      precioBolsaConIVA: Math.round(LAST.bagGross||0),
      tipoBolsa: bagType,
      maquinaElegida: picked.machLabel || null,
      bolsaElegida: picked.bagLabel || null,
      aviso: LAST.warn || null,
    };
  },
};

/* ============ init ============ */
NUMS.forEach(k => $(k).value = DEFAULTS[k]);
$('mDate').valueAsDate = new Date();
$('mRef').value = newUID();
$('mName').value = 'Selladora al vacío · café';
fillFilters('mach'); fillFilters('bag');
applyLang();
</script>
</body>
</html>
