[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogg-transcriber"
version = "0.1.0"
description = "Local OGG (WhatsApp voice note) -> speaker-labeled transcript: faster-whisper + pyannote via WhisperX."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "whisperx>=3.8,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ogg-transcribe = "ogg_transcriber.cli:main"

[tool.setuptools]
packages = ["ogg_transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs real models (needs the venv + first-run downloads); enable with RUN_SLOW=1",
]
addopts = "-ra"
